name: Deploy DNI VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "dni-vps"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify build
        run: npm run verify

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Sync OVH VPS from GitHub
        env:
          DNI_DEPLOY_TOKEN: ${{ secrets.DNI_DEPLOY_TOKEN }}
          DNI_DEPLOY_URL: https://www.dreadnoughtimperium.org/deploy.php
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DNI_DEPLOY_TOKEN:-}" ]; then
            echo "DNI_DEPLOY_TOKEN GitHub secret is not configured."
            exit 1
          fi
          curl --fail-with-body --show-error --silent \
            --connect-timeout 20 \
            --max-time 600 \
            --retry 2 \
            --retry-delay 3 \
            -X POST \
            -H "Authorization: Bearer ${DNI_DEPLOY_TOKEN}" \
            -H "Accept: application/json" \
            "${DNI_DEPLOY_URL}"

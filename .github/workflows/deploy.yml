name: Verify DNI Main

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "dni-main-verify"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify build
        run: npm run verify

      - name: Deployment note
        run: echo "Production OVH VPS polls origin/main and deploys verified changes automatically; no deploy token or public deploy endpoint is used."

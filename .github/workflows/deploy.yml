name: Deploy DNI VPS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "dni-vps-deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Check server and Rocky LAMP deploy syntax
        run: |
          node --check server/runtime/node/server.mjs
          node --check server/runtime/node/deploy.mjs
          node --check server/runtime/node/runtime-env.mjs
          node --check server/dni-server.mjs
          node --check server/dni-deploy.mjs
          node --check server/runtime-env.mjs
          node --check scripts/build/build.js
          node --check public/auth/discord/auth-bridge.js
          node --input-type=module --check < public/src/js/routing.js
          node --input-type=module --check < public/src/js/comms-provider.js
          node --input-type=module --check < public/src/js/dashboard.js
          node --input-type=module --check < public/src/js/services.js
          node --input-type=module --check < public/src/js/admin.js
          node --input-type=module --check < public/src/js/admin-role-prefill.js
          node --input-type=module --check < public/src/js/sectors-api.js
          node --input-type=module --check < public/src/js/sectors-admin.js
          php -l public/deploy.php
          php -l public/github-webhook.php
          php -l public/sync-runtime-secrets.php
          php -l public/auth/index.php
          php -l public/admin-role-prefill.php
          php -l public/api/index.php
          php -l public/api/legacy.php
          php -l public/sectors-data.php
          php -l public/admin-data.php
          php -l server-http/sectors-data.php
          php -l server-http/sectors-data-mariadb.php
          php -l server-http/admin-data.php
          php -l server-http/admin-data-mariadb.php
          php -l server-http/admin-secure.php
          php -l server/php/dni.php
          php -l server/php/api-runtime.php
          php -l server/php/dni-operational-security.php
          php -l scripts/database/migrate.php
          php -l scripts/migrate.php
          php -l scripts/build/build-lamp.php
          php -l scripts/build-lamp.php
          php -l deploy/apache/configure-httpd-vhost.php
          php -l deploy/ovhcloud/configure-httpd-vhost.php
          bash -n deploy/rocky9/bootstrap-vps.sh
          bash -n deploy/ovhcloud/bootstrap-vps.sh
          bash -n deploy/scripts/maintenance.sh
          bash -n deploy/scripts/github-actions-deploy.sh
          bash -n database/tools/install-rocky.sh
          bash -n database/install-rocky.sh

      - name: Verify PHP LAMP asset builder
        run: |
          php scripts/build/build-lamp.php . "${GITHUB_SHA:0:12}"
          npm run verify

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: verify
    env:
      STAR_COMMS_OWNER_KEY: ${{ secrets.STAR_COMMS_OWNER_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STAR_COMMS_OWNER_KEY:-}" ]; then
            echo "::error::Required repository secret STAR_COMMS_OWNER_KEY is not configured."
            exit 1
          fi

      - name: Trigger automatic OVH deployment
        shell: bash
        run: bash deploy/scripts/github-actions-deploy.sh

# Force deployment refresh: 2026-08-25T16:17-07:00
name: Deploy DNI VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "dni-vps-deploy"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Check server syntax
        run: |
          node --check server/dni-server.mjs
          node --check server/dni-deploy.mjs
          if command -v php >/dev/null 2>&1; then php -l public/deploy.php; fi

      - name: Verify build
        run: npm run verify

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Trigger automatic OVH deployment
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.dreadnoughtimperium.org/deploy.php"
          for attempt in $(seq 1 20); do
            body_file="$(mktemp)"
            code="$(curl --show-error --silent \
              --connect-timeout 20 \
              --max-time 900 \
              -X POST \
              -H "Accept: application/json" \
              -H "X-DNI-Deploy-Source: github-actions" \
              -o "$body_file" \
              -w '%{http_code}' \
              "$url" || true)"

            echo "deploy.php attempt ${attempt}/20 -> HTTP ${code}"
            cat "$body_file" || true
            rm -f "$body_file"

            if [ "$code" = "200" ]; then
              exit 0
            fi

            if [ "$code" = "404" ] || [ "$code" = "409" ] || [ "$code" = "502" ] || [ "$code" = "503" ] || [ "$code" = "504" ] || [ "$code" = "000" ]; then
              if [ "$attempt" -lt 20 ]; then
                sleep 15
                continue
              fi
            fi

            echo "Automatic DNI deployment failed with HTTP ${code}."
            exit 1
          done

          echo "deploy.php did not become ready within the retry window."
          exit 1

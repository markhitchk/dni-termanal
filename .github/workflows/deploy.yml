name: Deploy DNI VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "dni-vps-deploy"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Check server syntax
        run: |
          node --check server/dni-server.mjs
          node --check server/dni-deploy.mjs

      - name: Verify build
        run: npm run verify

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Trigger automatic OVH deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
            --connect-timeout 20 \
            --max-time 900 \
            --retry 2 \
            --retry-delay 5 \
            -X POST \
            -H "Accept: application/json" \
            -H "X-DNI-Deploy-Source: github-actions" \
            "https://www.dreadnoughtimperium.org/deploy.php"

name: Deploy DNI VPS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "dni-vps-deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Check server and Rocky LAMP deploy syntax
        run: |
          node --check server/dni-server.mjs
          node --check server/dni-deploy.mjs
          node --input-type=module --check < public/src/js/routing.js
          php -l public/deploy.php
          php -l public/github-webhook.php
          php -l public/sync-runtime-secrets.php
          php -l public/auth/index.php
          php -l public/api/index.php
          php -l server/php/dni.php
          php -l scripts/build-lamp.php
          php -l deploy/ovhcloud/configure-httpd-vhost.php
          bash -n deploy/ovhcloud/bootstrap-vps.sh
          bash -n database/install-rocky.sh

      - name: Verify PHP LAMP asset builder
        run: |
          php scripts/build-lamp.php . "${GITHUB_SHA:0:12}"
          npm run verify

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: verify
    env:
      STAR_COMMS_OWNER_KEY: ${{ secrets.STAR_COMMS_OWNER_KEY }}
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STAR_COMMS_OWNER_KEY:-}" ]; then
            echo "::error::Required repository secret STAR_COMMS_OWNER_KEY is not configured."
            exit 1
          fi

      - name: Trigger automatic OVH deployment
        shell: bash
        run: |
          set -euo pipefail
          deploy_url="https://www.dreadnoughtimperium.org/deploy.php"
          sync_url="https://www.dreadnoughtimperium.org/sync-runtime-secrets.php"
          last_code="000"

          deploy_request() {
            local output_file="$1"
            curl --show-error --silent \
              --connect-timeout 20 \
              --max-time 900 \
              -X POST \
              -H "Accept: application/json" \
              -H "X-DNI-Deploy-Source: github-actions" \
              -o "$output_file" \
              -w '%{http_code}' \
              "$deploy_url" || true
          }

          sync_secret() {
            local output_file="$1"
            curl --show-error --silent \
              --connect-timeout 20 \
              --max-time 60 \
              -X POST \
              -H "Accept: application/json" \
              -H "X-DNI-Deploy-Source: github-actions" \
              -H "X-DNI-Star-Comms-Owner-Key: ${STAR_COMMS_OWNER_KEY}" \
              -o "$output_file" \
              -w '%{http_code}' \
              "$sync_url" || true
          }

          for attempt in 1 2 3 4; do
            body_file="$(mktemp)"
            code="$(deploy_request "$body_file")"

            if [[ ! "$code" =~ ^[0-9]{3}$ ]]; then
              code="000"
            fi

            last_code="$code"
            echo "deploy.php attempt ${attempt}/4 -> HTTP ${code}"
            cat "$body_file" || true
            rm -f "$body_file"

            if [ "$code" = "200" ]; then
              sync_ok=0
              for sync_attempt in 1 2 3 4; do
                sync_file="$(mktemp)"
                sync_code="$(sync_secret "$sync_file")"
                if [[ ! "$sync_code" =~ ^[0-9]{3}$ ]]; then
                  sync_code="000"
                fi

                echo "runtime secret sync ${sync_attempt}/4 -> HTTP ${sync_code}"
                cat "$sync_file" || true

                if [ "$sync_code" = "200" ] && grep -Eq '"starCommsSecretConfigured"[[:space:]]*:[[:space:]]*true' "$sync_file"; then
                  sync_ok=1
                  rm -f "$sync_file"
                  break
                fi

                rm -f "$sync_file"
                if [ "$sync_attempt" -lt 4 ]; then
                  sleep 3
                fi
              done

              if [ "$sync_ok" != "1" ]; then
                echo "::error::STAR_COMMS_OWNER_KEY was not confirmed on the VPS after deployment."
                exit 1
              fi

              exit 0
            fi

            if [ "$attempt" -lt 4 ] && { [ "$code" = "404" ] || [ "$code" = "409" ] || [ "$code" = "502" ] || [ "$code" = "503" ] || [ "$code" = "504" ] || [ "$code" = "000" ]; }; then
              sleep 15
              continue
            fi
            break
          done

          echo
          echo "Automatic DNI deployment failed with HTTP ${last_code}."
          if [ "$last_code" = "404" ]; then
            echo "The Rocky Linux 9 LAMP VPS needs the one-time DNI wiring step."
            echo "This bootstrap reuses the existing Apache/PHP stack and does NOT run apt, dnf, yum, or install/replace packages."
            echo "Run this ONCE in the OVH VPS console:"
            echo "curl -fsSL https://raw.githubusercontent.com/markhitchk/dni-termanal/main/deploy/ovhcloud/bootstrap-vps.sh | sudo bash"
            echo "After that, future pushes to main deploy automatically through /deploy.php."
          fi
          exit 1

name: Deploy DNI VPS

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "database/backups/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "dni-vps-deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Check server and Rocky LAMP deploy syntax
        run: |
          node --check server/runtime/node/server.mjs
          node --check server/runtime/node/deploy.mjs
          node --check server/runtime/node/runtime-env.mjs
          node --check server/dni-server.mjs
          node --check server/dni-deploy.mjs
          node --check server/runtime-env.mjs
          node --check scripts/build/build.js
          node --check public/auth/discord/auth-bridge.js
          node --input-type=module --check < public/src/js/mail.js
          node --input-type=module --check < public/src/js/mail-controls.js
          node --input-type=module --check < public/src/js/mail-address-client.js
          node --input-type=module --check < public/src/js/mail-ux.js
          node --input-type=module --check < public/src/js/mail/mail-realtime.js
          node --input-type=module --check < public/src/js/mail-priority-live.js
          node --input-type=module --check < public/src/js/routing.js
          node --input-type=module --check < public/src/js/comms-provider.js
          node --input-type=module --check < public/src/js/dashboard.js
          node --input-type=module --check < public/src/js/services.js
          node --input-type=module --check < public/src/js/admin.js
          node --input-type=module --check < public/src/js/admin-role-prefill.js
          node --input-type=module --check < public/src/js/operational-admin.js
          node --input-type=module --check < public/src/js/sectors-api.js
          node --input-type=module --check < public/src/js/sectors-admin.js
          php -l public/deploy.php
          php -l public/deploy-session-reset.php
          php -l public/github-webhook.php
          php -l public/sync-runtime-secrets.php
          php -l public/sync-backup-secrets.php
          php -l public/backup-databases.php
          php -l public/auth/index.php
          php -l public/admin-role-prefill.php
          php -l public/api/index.php
          php -l public/api/legacy.php
          php -l public/sectors-data.php
          php -l public/admin-data.php
          php -l public/mail-data.php
          php -l public/mail-events.php
          php -l public/mail-upload.php
          php -l server-http/sectors-data.php
          php -l server-http/sectors-data-mariadb.php
          php -l server-http/admin-data.php
          php -l server-http/admin-data-mariadb.php
          php -l server-http/admin-secure.php
          php -l server-http/operational-classification.php
          php -l server-http/mail-data.php
          php -l server-http/mail-events.php
          php -l server-http/mail-upload.php
          php -l server/php/dni.php
          php -l server/php/dni-mail.php
          php -l server/php/dni-mail-master-welcome.php
          php -l server/php/dni-mail-realtime.php
          php -l server/php/dni-mail-support-routes.php
          php -l server/php/api-runtime.php
          php -l server/php/dni-operational-security.php
          php -l server/php/dni-operational-classification-contract.php
          php -l tests/operational-clearance.php
          php -l tests/mail/realtime-routing.php
          php -l scripts/database/migrate.php
          php -l scripts/migrate.php
          php -l scripts/build/build-lamp.php
          php -l scripts/build-lamp.php
          php -l deploy/apache/configure-httpd-vhost.php
          php -l deploy/ovhcloud/configure-httpd-vhost.php
          bash -n deploy/rocky9/bootstrap-vps.sh
          bash -n deploy/ovhcloud/bootstrap-vps.sh
          bash -n deploy/scripts/maintenance.sh
          bash -n deploy/scripts/github-actions-deploy.sh
          bash -n deploy/backup/backup-databases.sh
          bash -n deploy/backup/configure-backups.sh
          bash -n database/tools/install-rocky.sh
          bash -n database/install-rocky.sh

      - name: Verify PHP LAMP asset builder and clearance invariants
        run: |
          php scripts/build/build-lamp.php . "${GITHUB_SHA:0:12}"
          php tests/operational-clearance.php
          npm run verify

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: verify
    env:
      STAR_COMMS_OWNER_KEY: ${{ secrets.STAR_COMMS_OWNER_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STAR_COMMS_OWNER_KEY:-}" ]; then
            echo "::error::Required repository secret STAR_COMMS_OWNER_KEY is not configured."
            exit 1
          fi

      - name: Trigger automatic OVH deployment
        shell: bash
        run: bash deploy/scripts/github-actions-deploy.sh

      - name: Verify live DNI Mail browser assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://www.dreadnoughtimperium.org"
          probe="${GITHUB_SHA:0:12}-$(date +%s)"
          mail_file="$(mktemp)"
          controls_file="$(mktemp)"
          ux_file="$(mktemp)"
          address_file="$(mktemp)"
          upload_file="$(mktemp)"
          realtime_file="$(mktemp)"
          live_css_file="$(mktemp)"
          trap 'rm -f "$mail_file" "$controls_file" "$ux_file" "$address_file" "$upload_file" "$realtime_file" "$live_css_file"' EXIT

          fetch_asset() {
            local path="$1"
            local output="$2"
            local code
            code="$(curl --show-error --silent --location \
              --connect-timeout 20 \
              --max-time 60 \
              -H "Cache-Control: no-cache, no-store, max-age=0" \
              -H "Pragma: no-cache" \
              -o "$output" \
              -w '%{http_code}' \
              "${base}${path}?dni_live_probe=${probe}" || true)"
            echo "live asset ${path} -> HTTP ${code} // $(wc -c < "$output" 2>/dev/null || echo 0) bytes"
            if [ "$code" != "200" ]; then
              echo "::error::Live DNI browser asset ${path} returned HTTP ${code}."
              return 1
            fi
          }

          fetch_asset "/dist/mail.js" "$mail_file"
          fetch_asset "/dist/mail-controls.js" "$controls_file"
          fetch_asset "/dist/mail-ux.js" "$ux_file"
          fetch_asset "/dist/mail-address-client.js" "$address_file"
          fetch_asset "/dist/mail-upload-button.js" "$upload_file"
          fetch_asset "/dist/mail-realtime.js" "$realtime_file"
          fetch_asset "/dist/mail-live.css" "$live_css_file"

          grep -Fq 'CDN File Attachments' "$mail_file" || { echo "::error::Live /dist/mail.js is stale: CDN File Attachments is missing."; exit 1; }
          grep -Fq 'data-mail-cdn-input' "$mail_file" || { echo "::error::Live /dist/mail.js is stale: upload input marker is missing."; exit 1; }
          grep -Fq 'DNI_CDN_MAX_FILE_BYTES = 200 * 1024 * 1024' "$mail_file" || { echo "::error::Live /dist/mail.js is stale: 200 MB upload logic is missing."; exit 1; }
          grep -Fq "const SESSION_URL = '/mail-data.php?action=session';" "$controls_file" || { echo "::error::Live /dist/mail-controls.js is stale: auth-aware directory loading is missing."; exit 1; }
          grep -Fq "const DIRECTORY_URL = '/mail-data.php?action=directory';" "$controls_file" || { echo "::error::Live /dist/mail-controls.js is stale: server-authoritative recipient directory is missing."; exit 1; }
          if grep -Fq 'FALLBACK_SUPPORT_ROUTES' "$controls_file"; then
            echo "::error::Live /dist/mail-controls.js still contains browser-owned support route aliases."
            exit 1
          fi
          grep -Fq 'mail-address-client.js?v=' "$ux_file" || { echo "::error::Live /dist/mail-ux.js is stale: cache-busted address client import is missing."; exit 1; }
          grep -Fq 'mail-upload-button.js?v=' "$ux_file" || { echo "::error::Live /dist/mail-ux.js is stale: cache-busted upload-button import is missing."; exit 1; }
          grep -Fq "mail.js?v=" "$ux_file" || { echo "::error::Live /dist/mail-ux.js is stale: cache-busted Mail core import is missing."; exit 1; }
          grep -Fq 'DNI ADDRESS' "$address_file" || { echo "::error::Live DNI address client is stale or incomplete."; exit 1; }
          grep -Fq 'support.dni.org' "$address_file" || { echo "::error::Live DNI address client does not accept support.dni.org."; exit 1; }
          grep -Fq 'Upload Image / File' "$upload_file" || { echo "::error::Live DNI upload-button module is stale or incomplete."; exit 1; }
          grep -Fq 'POLL_DELAY_MS = 1000' "$realtime_file" || { echo "::error::Live DNI Mail realtime client does not contain bounded Apache/PHP polling."; exit 1; }
          grep -Fq 'action=poll' "$realtime_file" || { echo "::error::Live DNI Mail realtime polling endpoint is missing."; exit 1; }
          grep -Fq '/mail-events.php' "$realtime_file" || { echo "::error::Live DNI Mail realtime client endpoint is missing."; exit 1; }
          grep -Fq 'peerUserIds' "$realtime_file" || { echo "::error::Live DNI Mail realtime client is missing direct typing-scope filtering."; exit 1; }
          grep -Fq 'dni-mail-typing-indicator' "$live_css_file" || { echo "::error::Live DNI Mail typing indicator styles are missing."; exit 1; }
          grep -Fq '@media (max-width:768px)' "$live_css_file" || { echo "::error::Live DNI Mail responsive phone/tablet rules are missing."; exit 1; }

          echo "Live DNI Mail browser assets match the server-authoritative recipient, bounded realtime sync, typing-presence, upload, and responsive composer build."

      - name: Invalidate stale DNI login sessions
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          code="$(curl --show-error --silent \
            --connect-timeout 20 \
            --max-time 120 \
            -X POST \
            -H "Accept: application/json" \
            -H "X-DNI-Deploy-Source: github-actions" \
            -H "X-DNI-Star-Comms-Owner-Key: ${STAR_COMMS_OWNER_KEY}" \
            -o "$body_file" \
            -w '%{http_code}' \
            "https://www.dreadnoughtimperium.org/deploy-session-reset.php" || true)"
          cat "$body_file" || true
          if [ "$code" != "200" ] || ! grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$body_file"; then
            echo "::error::DNI active-session invalidation failed with HTTP ${code}."
            rm -f "$body_file"
            exit 1
          fi
          rm -f "$body_file"

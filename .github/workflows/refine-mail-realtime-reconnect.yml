name: Refine DNI Mail Reconnect

on:
  push:
    branches:
      - fix/mail-realtime-incremental-refresh-work

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Refine reconnect behavior
        run: python3 .github/refine-mail-realtime-reconnect.py
      - name: Install dependencies
        run: npm ci
      - name: Build and verify
        shell: bash
        run: |
          npm run build
          php scripts/build/build-lamp.php . "${GITHUB_SHA:0:12}"
          npm run verify
          node --input-type=module --check < public/src/js/mail/mail-realtime.js
          if grep -n "inbox.dispatchEvent(new MouseEvent('click'" public/src/js/mail/mail-realtime.js; then exit 1; fi
      - name: Commit refinement
        shell: bash
        run: |
          rm .github/workflows/refine-mail-realtime-reconnect.yml .github/refine-mail-realtime-reconnect.py
          git config user.name "markhitchk"
          git config user.email "mark.hitchk@gmail.com"
          git add public/src/js/mail/mail-realtime.js tests/mail/verify-mail-realtime.js .github/workflows/refine-mail-realtime-reconnect.yml .github/refine-mail-realtime-reconnect.py
          git commit -m "Avoid periodic full Mail resyncs"
          git push origin HEAD

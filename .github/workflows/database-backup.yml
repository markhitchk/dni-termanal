name: Backup DNI Databases

on:
  workflow_dispatch:
  schedule:
    - cron: "10 4 * * *"
  workflow_run:
    workflows: ["Deploy DNI VPS"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: dni-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    env:
      STAR_COMMS_OWNER_KEY: ${{ secrets.STAR_COMMS_OWNER_KEY }}
      DNI_BACKUP_GITHUB_TOKEN: ${{ github.token }}
      DNI_BACKUP_ENCRYPTION_KEY: ${{ secrets.DNI_BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Validate backup credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STAR_COMMS_OWNER_KEY:-}" ]; then
            echo "::error::Required repository secret STAR_COMMS_OWNER_KEY is not configured."
            exit 1
          fi
          if [ -z "${DNI_BACKUP_GITHUB_TOKEN:-}" ]; then
            echo "::error::GitHub Actions did not provide the repository GITHUB_TOKEN."
            exit 1
          fi
          if [ "${#DNI_BACKUP_ENCRYPTION_KEY}" -lt 32 ]; then
            echo "::error::Required repository secret DNI_BACKUP_ENCRYPTION_KEY must be at least 32 characters."
            exit 1
          fi

      - name: Synchronize backup credentials to VPS
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          code="$(curl --show-error --silent \
            --connect-timeout 20 \
            --max-time 60 \
            -X POST \
            -H "Accept: application/json" \
            -H "X-DNI-Star-Comms-Owner-Key: ${STAR_COMMS_OWNER_KEY}" \
            -H "X-DNI-Backup-Github-Token: ${DNI_BACKUP_GITHUB_TOKEN}" \
            -H "X-DNI-Backup-Encryption-Key: ${DNI_BACKUP_ENCRYPTION_KEY}" \
            -o "$body_file" \
            -w '%{http_code}' \
            "https://www.dreadnoughtimperium.org/sync-backup-secrets.php" || true)"
          cat "$body_file" || true
          if [ "$code" != "200" ] || ! grep -Eq '"backupSecretsConfigured"[[:space:]]*:[[:space:]]*true' "$body_file"; then
            echo "::error::DNI backup-secret synchronization failed with HTTP ${code}."
            rm -f "$body_file"
            exit 1
          fi
          rm -f "$body_file"

      - name: Push encrypted database backup from VPS
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          code="$(curl --show-error --silent \
            --connect-timeout 20 \
            --max-time 900 \
            -X POST \
            -H "Accept: application/json" \
            -H "X-DNI-Star-Comms-Owner-Key: ${STAR_COMMS_OWNER_KEY}" \
            -o "$body_file" \
            -w '%{http_code}' \
            "https://www.dreadnoughtimperium.org/backup-databases.php" || true)"
          cat "$body_file" || true
          if [ "$code" != "200" ] || ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"backed-up"' "$body_file"; then
            echo "::error::DNI VPS database backup failed with HTTP ${code}."
            rm -f "$body_file"
            exit 1
          fi
          rm -f "$body_file"

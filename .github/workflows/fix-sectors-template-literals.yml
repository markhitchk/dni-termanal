name: Fix Sectors Template Literals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sectors-template-literals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Sectors editor template literals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          admin_path = Path('public/src/js/admin.js')
          admin = admin_path.read_text()

          replacements = {
              'Edits here change the database read by the `/sectors` module.': 'Edits here change the database read by the /sectors module.',
              'Fleets, bases, stations, and installations displayed in `/sectors`.': 'Fleets, bases, stations, and installations displayed in /sectors.'
          }

          for old, new in replacements.items():
              count = admin.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one Admin template-literal marker, found {count}: {old}')
              admin = admin.replace(old, new, 1)

          if '`/sectors`' in admin:
              raise SystemExit('Unsafe raw backticks around /sectors remain in admin.js')

          admin_path.write_text(admin)

          verify_path = Path('scripts/verify-admin-stability.js')
          verify = verify_path.read_text()
          marker = "if (admin.includes('databaseData.sectors.length') || admin.includes('databaseData.assets.length')) {\n"
          guard = "if (admin.includes('`/sectors`')) {\n  fail('Admin Sectors editor text must not use raw backticks around /sectors inside JavaScript template literals.');\n}\n\n"
          if guard not in verify:
              if marker not in verify:
                  raise SystemExit('Verifier insertion marker missing')
              verify = verify.replace(marker, guard + marker, 1)
          verify_path.write_text(verify)
          PY

          node --check public/src/js/admin.js
          node scripts/verify-admin-stability.js
          grep -F 'read by the /sectors module.' public/src/js/admin.js
          grep -F 'displayed in /sectors.' public/src/js/admin.js
          ! grep -F '`/sectors`' public/src/js/admin.js

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          git config user.name "markhitchk"
          git config user.email "mark.hitchk@gmail.com"
          git rm .github/workflows/fix-sectors-template-literals.yml
          git add public/src/js/admin.js scripts/verify-admin-stability.js
          git commit -m "Fix Sectors editor template literal crash"
          git pull --rebase origin main
          git push origin HEAD:main

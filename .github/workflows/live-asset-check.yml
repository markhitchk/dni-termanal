name: Check exact live SCiPNET bundles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact live files and record results
        run: |
          set +e
          BASE='https://scipnet-terminal.web.app'
          rm -f LIVE_ASSET_CHECK.txt LIVE_CURRENT_INDEX.html LIVE_CURRENT_JS.js LIVE_CURRENT_CSS.css
          : > LIVE_ASSET_CHECK.txt
          fetch_one() {
            name="$1"; url="$2"; out="$3"
            code=$(curl -L -sS --connect-timeout 10 --max-time 120 -w '%{http_code}' -o "$out" "$url")
            rc=$?
            size=0
            [ -f "$out" ] && size=$(wc -c < "$out")
            printf '%s http=%s rc=%s bytes=%s url=%s\n' "$name" "$code" "$rc" "$size" "$url" >> LIVE_ASSET_CHECK.txt
          }
          fetch_one index "$BASE/" LIVE_CURRENT_INDEX.html
          fetch_one js "$BASE/assets/index-DFQE3juD.js" LIVE_CURRENT_JS.js
          fetch_one css "$BASE/assets/index-DF9dB6rR.css" LIVE_CURRENT_CSS.css
          cat LIVE_ASSET_CHECK.txt
      - name: Commit diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIVE_ASSET_CHECK.txt LIVE_CURRENT_INDEX.html LIVE_CURRENT_JS.js LIVE_CURRENT_CSS.css 2>/dev/null || true
          git commit -m 'Record live SCiPNET bundle fetch result' || exit 0
          git push origin HEAD:main

name: Repair DNI Operations access and routing

on:
  push:
    branches: [main]
    paths:
      - scripts/patches/repair-operations.js
      - .github/workflows/repair-operations-20260908.yml

permissions:
  contents: write

concurrency:
  group: dni-operations-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up PHP with SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
          tools: none
          coverage: none
      - name: Apply exact source repair
        run: node scripts/patches/repair-operations.js
      - name: Correct regression harness and Operations error state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(file, old, new):
              p = Path(file)
              text = p.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f'{file}: expected one source block, found {text.count(old)}')
              p.write_text(text.replace(old, new))
          replace('server/php/dni-operations.php',
              '|| dni_is_citizen_user($user) || !$this->member($user)) {',
              '|| (dni_is_citizen_user($user) && !$this->admin) || !$this->member($user)) {')
          file = 'public/src/js/operations/operations-app.js'
          replace(file, 'let session = null, corp =', 'let session = null, sessionError = null, corp =')
          replace(file, "      session=await api('session');\n      showTab(true);",
              "      session=await api('session');\n      sessionError=null;\n      showTab(true);")
          replace(file, 'session=null;showTab(false);\n      if(location.pathname',
              'session=null;sessionError=error;showTab(false);\n      if(location.pathname')
          replace(file, "          showTab(true);\n          panel.hidden=false;",
              "          showTab(true);\n          window.dispatchEvent(new CustomEvent('dni:operations-ready'));\n          panel.hidden=false;")
          replace(file, "const active=shell.dataset.panel==='operations'&&Boolean(session);panel.hidden=!active;tab.setAttribute('aria-selected',String(active));if(active)refresh();",
              "const active=shell.dataset.panel==='operations'&&(Boolean(session)||Boolean(sessionError));panel.hidden=!active;tab.setAttribute('aria-selected',String(active));if(active&&session)refresh();")
          Path('tests/operations/verify-access.js').write_text(r'''const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve(__dirname, '../..');
          const read = p => fs.readFileSync(path.join(root,p),'utf8');
          const routing = read('public/src/js/routing.js');
          const build = read('scripts/build/build-lamp.php');
          const deploy = read('public/deploy.php');
          const controller = read('server-http/operations-data.php');
          const operations = read('server/php/dni-operations.php');
          assert.ok(routing.includes("operations: '/operations'"));
          assert.ok(routing.includes("case '/operations': return 'operations'"));
          assert.ok(routing.includes('dni:operations-ready'));
          assert.ok(build.includes("'admin', 'operations'"));
          assert.ok(deploy.includes("'admin', 'operations'"));
          assert.ok(deploy.includes("'/operations/'"));
          assert.ok(controller.includes('dni_operations_staff_authorized($user)'));
          assert.ok(operations.includes('$this->admin = dni_operations_staff_authorized($user)'));
          assert.ok(operations.includes('operations.isb.read_restricted'));
          const app = read('public/src/js/operations/operations-app.js');
          assert.ok(app.includes('dni:operations-ready'));
          assert.ok(app.includes('sessionError'));
          assert.ok(read('public/src/js/authz.js').includes("'/operations'"));
          console.log('DNI Operations routing, deployment and authorization checks passed.');
          ''')
          PY
      - name: Validate PHP and JavaScript syntax
        run: |
          set -e
          for file in server/php/dni-operations-access.php server/php/dni-operations.php server-http/operations-data.php public/deploy.php scripts/build/build-lamp.php tests/operations/verify-access.php; do php -l "$file"; done
          for file in public/src/js/routing.js public/src/js/authz.js public/src/js/operations/operations-app.js tests/operations/verify-access.js; do node --check "$file"; done
      - name: Check authorization and route regressions
        run: |
          php tests/operations/verify-access.php
          node tests/operations/verify-access.js
      - name: Rebuild and verify direct Operations route
        run: |
          php scripts/build/build-lamp.php . ops-repair-test
          test -s public/operations/index.html
          test -s public/index.html
          cmp public/index.html public/operations/index.html
          grep -q 'operations' public/src/js/routing.js
          git diff --check
      - name: Commit verified repair to main
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/patches/repair-operations.js .github/workflows/repair-operations-20260908.yml
          git add -- server/php/dni-operations-access.php server/php/dni-operations.php server-http/operations-data.php public/src/js/routing.js public/src/js/authz.js public/src/js/operations/operations-app.js scripts/build/build-lamp.php public/deploy.php tests/operations/verify-access.php tests/operations/verify-access.js
          git diff --cached --check
          git commit -m 'fix(operations): restore staff access and direct route deployment'
          git push origin HEAD:main

name: Probe live SCiPNET files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-live:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe live files
        run: |
          set +e
          BASE='https://scipnet-terminal.web.app'
          : > LIVE_PROBE.txt
          probe() {
            url="$1"
            out="$2"
            code=$(curl -sS -L --connect-timeout 10 --max-time 60 -w '%{http_code}' -o "$out" "$url")
            rc=$?
            size=0
            [ -f "$out" ] && size=$(wc -c < "$out")
            echo "$code rc=$rc size=$size $url" | tee -a LIVE_PROBE.txt
          }
          probe "$BASE/" LIVE_INDEX.html
          probe "$BASE/assets/index-DFQE3juD.js" LIVE_BUNDLE.js
          probe "$BASE/assets/index-DF9dB6rR.css" LIVE_STYLE.css
          probe "$BASE/favicon/site.webmanifest" LIVE_MANIFEST.webmanifest
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIVE_PROBE.txt LIVE_INDEX.html LIVE_BUNDLE.js LIVE_STYLE.css LIVE_MANIFEST.webmanifest || true
          git commit -m "Probe current live SCiPNET Vite assets" || exit 0
          git push origin HEAD:main

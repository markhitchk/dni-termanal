name: Hotfix DNI branding internals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-branding-internals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Remove unsafe generic branding replacements
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy-pages.yml')
          s = p.read_text('utf-8')
          for line in [
              "              ('SCiPNET', 'DNI'),\n",
              "              ('SCIPNET', 'DNI'),\n",
              "              ('scipnet', 'dni'),\n",
          ]:
              s = s.replace(line, '')
          p.write_text(s, 'utf-8')
          PY
          rm -f .github/workflows/hotfix-branding-internals.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-pages.yml .github/workflows/hotfix-branding-internals.yml
          git commit -m 'Keep DNI rebrand out of internal asset and Firebase identifiers'
          git push

name: MutationObserver Audit

on:
  push:
    branches:
      - audit/all-mutation-observers-20260902

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List every source MutationObserver
        shell: bash
        run: |
          echo '=== MutationObserver constructors ==='
          grep -R -n -C 3 'MutationObserver' public/src/js || true
          echo '=== Whole-document observe targets ==='
          grep -R -n -C 5 -E '\.observe\(document\.(body|documentElement)' public/src/js || true

      - name: Reject whole-document observers in production mail and admin surfaces
        shell: bash
        run: |
          if grep -R -n -E '\.observe\(document\.(body|documentElement)' \
            public/src/js/mail public/src/js/mail*.js public/src/js/admin*.js; then
            echo 'Persistent whole-document observer remains in a production mail/admin surface.' >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        shell: bash
        run: |
          npm run build
          php scripts/build/build-lamp.php . "${GITHUB_SHA:0:12}"
          npm run verify

      - name: Audit built mail/admin assets
        shell: bash
        run: |
          if grep -n -E '\.observe\(document\.(body|documentElement)' public/dist/mail*.js public/dist/admin*.js; then
            echo 'Whole-document observer remains in built mail/admin assets.' >&2
            exit 1
          fi

name: One-time DNI source migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-migration.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dni-source-migration
  cancel-in-progress: false

jobs:
  migrate-build-test-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Convert committed source to DNI
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit
          from urllib.request import Request, urlopen
          import json, re, shutil, time

          root = Path('.')
          src = root / 'public' / 'src'

          # Preserve a deployable copy of the upstream provenance document.  The
          # HTML runtime links here instead of embedding historical lore/brands.
          shutil.copy2(root / 'UPSTREAM_SOURCE.md', root / 'public' / 'UPSTREAM_SOURCE.md')

          # ACCESS is now a local DNI archive feature.  It no longer proxies,
          # scrapes, rewrites, or hot-links third-party fiction wiki content.
          (src / 'js' / 'access.js').write_text(r'''import { appendError, appendNormal, cmdHide, cmdShow, btnShow, scroll, loadFile } from "./utils.js";

const DNI_RECORDS = {
  "173": {
    title: "DNI-173",
    sector: "DNI SECTOR 01",
    status: "ACTIVE ARCHIVE RECORD",
    summary: "DNI-173 is a Dreadnought Imperium archive record used to verify terminal access, clearance handling, and local document rendering."
  }
};

function normalizeRecord(value) {
  const raw = String(value ?? "").trim().toLowerCase().replace(/^dni-/, "");
  if (!/^\d{1,6}$/.test(raw)) return null;
  return raw.padStart(3, "0");
}

function renderRecord(id, clearance) {
  const shortId = String(Number(id));
  const record = DNI_RECORDS[shortId] || {
    title: `DNI-${id}`,
    sector: "DNI ARCHIVE",
    status: "INDEXED RECORD",
    summary: "This identifier is reserved in the Dreadnought Imperium DNI archive. Operational details are available only when authored in the local archive; no external lore database is queried."
  };
  const level = Number.isFinite(Number(clearance)) ? Math.max(0, Math.min(5, Number(clearance))) : 0;
  appendNormal(`<br><div class="infoCard"><blockquote><hr><br><img class="logo_heds" style="width:40px;height:40px;" src="/src/images/dni.svg" alt="DNI logo"><br>DOCUMENT: <span class="highlight">${record.title}</span><br>SECTOR: <span class="highlight">${record.sector}</span><br>STATUS: <span class="highlight">${record.status}</span><br>CLEARANCE VIEW: <span class="highlight">LEVEL ${level}</span><hr></blockquote></div><blockquote><h2>${record.title}</h2><p>${record.summary}</p></blockquote>`);
  addEventLog(`Access to ${record.title} granted`);
  btnShow();
  cmdShow();
  scroll();
}

export function access(accessNo, accessCl) {
  const id = normalizeRecord(accessNo);
  if (!id) {
    appendError("INVALID DNI DOCUMENT NUMBER. USE A NUMERIC IDENTIFIER SUCH AS ACCESS 173.");
    btnShow();
    cmdShow();
    return;
  }
  cmdHide();
  $d.append(`<blockquote id="fileSize"></blockquote>`);
  loadFile("Loading DNI archive record", "Decrypting local document");
  addEventLog(`Accessing DNI-${id} documentation...`);
  const finish = () => {
    if (typeof inBar !== "undefined" && inBar) {
      window.setTimeout(finish, 75);
      return;
    }
    renderRecord(id, accessCl);
  };
  finish();
}
''', 'utf-8')


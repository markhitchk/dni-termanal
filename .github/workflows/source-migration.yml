const cases = [
  ['320px baseline', 320, 700, true],
  ['iPhone SE', 375, 667, true],
  ['Pixel 7', 412, 915, true],
  ['iPhone 14/15', 390, 844, true],
  ['large phone', 430, 932, true],
  ['iPad Mini', 744, 1133, true],
  ['iPad Pro 12.9 portrait', 1024, 1366, true],
  ['iPad Pro 12.9 landscape', 1366, 1024, true],
  ['desktop wide', 1440, 900, false],
];

for (const [name, width, height, touch] of cases) {
  test(name, async ({ browser }) => {
    const context = await browser.newContext({ viewport: { width, height }, hasTouch: touch, isMobile: touch && width < 700 });
    const page = await context.newPage();
    await page.goto('http://127.0.0.1:4173/dni-termanal/', { waitUntil: 'domcontentloaded' });
    await page.waitForTimeout(900);

    await expect(page).toHaveTitle('DNI Terminal | Dreadnought Imperium DNI Sectors');

    const bodyOverflow = await page.evaluate(() => Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth);
    expect(bodyOverflow, 'page-level horizontal overflow').toBeLessThanOrEqual(3);

    const labels = ['DNI Communications', 'DNI Services', 'DNI Dashboard'];
    for (const label of labels) {
      const item = page.getByText(label, { exact: true }).first();
      await expect(item, `${label} exists`).toBeVisible();
      const metrics = await item.evaluate(el => {
        const style = getComputedStyle(el);
        return { scrollWidth: el.scrollWidth, clientWidth: el.clientWidth, textOverflow: style.textOverflow, whiteSpace: style.whiteSpace };
      });
      expect(metrics.scrollWidth - metrics.clientWidth, `${label} is not truncated`).toBeLessThanOrEqual(2);
      expect(metrics.textOverflow).not.toBe('ellipsis');
    }

    let nav = page.locator('header [class*="navContainer"]').first();
    if (await nav.count() === 0) nav = page.locator('header nav').first();
    if (await nav.count()) {
      const info = await nav.evaluate(el => ({ scrollWidth: el.scrollWidth, clientWidth: el.clientWidth, overflowX: getComputedStyle(el).overflowX }));
      if (info.scrollWidth > info.clientWidth + 2) {
        expect(['auto','scroll']).toContain(info.overflowX);
        const moved = await nav.evaluate(el => { el.scrollLeft = Math.min(80, el.scrollWidth - el.clientWidth); return el.scrollLeft; });
        expect(moved, 'horizontal nav scrolling works').toBeGreaterThan(0);
      }
    }

    const logo = page.locator('img[data-dni-logo="1"]:visible, img[alt*="DNI" i]:visible, img[src*="DNI" i]:visible, img[src*="dni" i]:visible').first();
    await expect(logo, 'DNI logo is visible').toBeVisible();
    const logoInfo = await logo.evaluate(el => ({ src: el.currentSrc || el.src, w: el.naturalWidth, h: el.naturalHeight }));
    expect(logoInfo.w).toBeGreaterThan(0);
    expect(logoInfo.h).toBeGreaterThan(0);
    expect(logoInfo.src).not.toMatch(/scp|scipnet/i);

    const terminal = page.locator('input:visible, textarea:visible, .xterm-screen:visible, [contenteditable="true"]:visible').last();
    await expect(terminal, 'terminal input area is available').toBeVisible();
    const rect = await terminal.boundingBox();
    expect(rect && rect.width, 'terminal area has usable width').toBeGreaterThan(Math.min(220, width - 40));
    expect(rect.x).toBeGreaterThanOrEqual(-2);
    expect(rect.x + rect.width).toBeLessThanOrEqual(width + 2);

    const tag = await terminal.evaluate(el => el.tagName.toLowerCase());
    if (width <= 430 && (tag === 'input' || tag === 'textarea')) {
      const font = await terminal.evaluate(el => parseFloat(getComputedStyle(el).fontSize));
      expect(font, 'mobile terminal input avoids browser zoom').toBeGreaterThanOrEqual(16);
    }

    const visibleText = await page.locator('body').innerText();
    expect(visibleText).not.toMatch(/SCiPNET|SCP[- ]/i);
    await context.close();
  });
}
''', 'utf-8')

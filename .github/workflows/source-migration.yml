          script += '''\n\n// DNI Services tab is committed source behavior, not a deployment-time patch.\n$("#services").off("click").bind("click", function () {\n    popUp("DNI Services", "<blockquote>Dreadnought Imperium DNI services are available through the terminal command interface.</blockquote>");\n});\n'''
          script_path.write_text(script, 'utf-8')

          # Rewrite the legacy shell directly so its metadata/navigation are
          # correct even when opened independently of the production snapshot.
          index_path = src / 'html' / 'index.html'
          index = index_path.read_text('utf-8')
          index = re.sub(r'<meta name="description"[^>]*>', '<meta name="description" content="DNI Terminal for Dreadnought Imperium sectors, communications, services, and local archive access.">', index, flags=re.I)
          index = re.sub(r'<meta name="author"[^>]*>', '<meta name="author" content="Dreadnought Imperium">', index, flags=re.I)
          index = re.sub(r'<meta name="keywords"[^>]*>', '<meta name="keywords" content="DNI,Dreadnought Imperium,DNI Terminal,DNI sectors,terminal,communications,services">', index, flags=re.I)
          index = re.sub(r'<title>.*?</title>', '<title>DNI Terminal | Dreadnought Imperium DNI Sectors</title>', index, count=1, flags=re.I|re.S)
          old_tabs = re.compile(r'<div class="topItems" id="cmdBtn">.*?<div style="clear:both"></div>', re.S)
          new_tabs = '''<div class="dni-nav-scroll" role="navigation" aria-label="DNI terminal sections">\n      <div class="topItems offTab" id="chat"><div class="nameTitle">DNI Communications</div></div>\n      <div class="topItems offTab" id="services"><div class="nameTitle">DNI Services</div></div>\n      <div class="topItems" id="cmdBtn"><div class="nameTitle">DNI Dashboard</div></div>\n    </div>\n    <div style="clear:both"></div>'''
          index = old_tabs.sub(new_tabs, index, count=1)
          index = index.replace('linkLanguage = "https://scp-wiki.wikidot.com//"', 'linkLanguage = "local-dni-archive"')
          index_path.write_text(index, 'utf-8')

          cmd_path = src / 'html' / 'cmd.html'
          cmd = cmd_path.read_text('utf-8')
          cmd = cmd.replace('SCiPNET DIRECT ACCESS TERMINAL', 'DNI DIRECT ACCESS TERMINAL')
          cmd = cmd.replace('SCP FOUNDATION', 'DREADNOUGHT IMPERIUM')
          cmd = cmd.replace('Secure . Contain . Protect', 'Dreadnought Imperium Network')
          cmd = cmd.replace('/src/images/scipnet.svg', '/src/images/dni.svg')
          cmd = cmd.replace('SCP Foundation Logo', 'DNI Logo')
          cmd = cmd.replace('Welcome to SCiPNET Direct Access Terminal', 'Welcome to DNI Direct Access Terminal')
          cmd_path.write_text(cmd, 'utf-8')

          # The old policy page described a runtime that fetched external lore.
          # Replace it intentionally, while keeping the exact historical license
          # attribution in UPSTREAM_SOURCE.md rather than falsifying attribution.
          (src / 'html' / 'license.html').write_text(r'''<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DNI Terminal — Licensing & Origin</title>
  <style>body{margin:0;background:#111820;color:#e8f6ff;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:0 auto;padding:32px 20px}a{color:#73dcff}code{background:#071017;padding:.15rem .35rem;border-radius:4px}</style>
</head>
<body><main>
  <h1>DNI Terminal — Licensing & Origin</h1>
  <p>The current DNI runtime uses Dreadnought Imperium branding and a local DNI archive. It does not fetch or republish the former third-party fiction wiki articles, logos, mirrors, or live-content feeds.</p>
  <h2>Upstream attribution</h2>
  <p>This project was derived from an earlier open-source terminal. Its exact upstream repository, source commit, historical attribution, and applicable share-alike licensing are preserved without rebranding in <a href="../../UPSTREAM_SOURCE.md">UPSTREAM_SOURCE.md</a> and in repository history.</p>
  <p>Any inherited material that remains subject to an upstream license remains under that license. DNI-original branding, copy, and assets are separate contributions unless a file states otherwise.</p>
  <h2>Current runtime</h2>
  <p>The <code>ACCESS</code> command opens local DNI records. Removing the former external-content feature does not erase the attribution obligations attached to inherited source history.</p>
</main></body></html>
''', 'utf-8')


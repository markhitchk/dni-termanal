name: Apply DNI logo and mobile layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dni-mobile-branding.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Patch Pages build
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/deploy-pages.yml')
          s = p.read_text('utf-8')

          anchor = "          index.write_text(html, 'utf-8')\n"
          if anchor not in s:
              raise SystemExit('Could not find HTML write anchor')

          patch = r'''          # DNI visual branding + responsive mobile/tablet layer.
          dni_logo_url = 'https://robertsspaceindustries.com/media/ym5kkd52hhrclr/logo/DNI-Logo.png'
          dni_logo_rel = 'assets/DNI-Logo.png'
          dni_logo = root / dni_logo_rel
          dni_logo.parent.mkdir(parents=True, exist_ok=True)
          subprocess.run(['curl','-fsSL','--retry','3',dni_logo_url,'-o',str(dni_logo)], check=True)
          if not dni_logo.exists() or not dni_logo.stat().st_size:
              raise RuntimeError('DNI logo download failed')
          dni_logo_web = page + '/' + dni_logo_rel

          # Replace old browser icons with the DNI logo.
          html = re.sub(r'<link[^>]+rel=["\'](?:shortcut icon|icon|apple-touch-icon)["\'][^>]*>', '', html, flags=re.I)
          html = re.sub(r'<meta[^>]+name=["\']viewport["\'][^>]*>', '', html, flags=re.I)

          mobile_style = r'''<style id="dni-mobile-responsive">
          :root { --dni-safe-top: env(safe-area-inset-top, 0px); --dni-safe-bottom: env(safe-area-inset-bottom, 0px); }
          html, body, #root { width:100%; max-width:100%; min-width:0; margin:0; }
          img[data-dni-logo="1"] { object-fit:contain !important; object-position:center !important; }
          [class*="welcomeLogo"] { object-fit:contain !important; }

          @media (max-width: 1024px) {
            html, body { overflow-x:hidden !important; }
            body, #root, .app-container { min-width:0 !important; max-width:100vw !important; }
            header, header [class*="navContainer"], header nav { max-width:100vw !important; min-width:0 !important; }
            header [class*="navContainer"] { overflow-x:auto !important; overflow-y:hidden !important; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
            header [class*="navContainer"]::-webkit-scrollbar { display:none; }
            header nav { display:flex !important; flex-wrap:nowrap !important; width:max-content !important; min-width:100% !important; }
            header nav a { flex:0 0 auto !important; white-space:nowrap !important; padding:10px 12px !important; font-size:clamp(10px, 2.5vw, 13px) !important; }
            [class*="terminalContainer"], [class*="terminalBodyContainer"], [class*="terminalBody"] { min-width:0 !important; max-width:100% !important; width:100% !important; }
            [class*="terminalInstances"] { overflow-x:auto !important; overflow-y:hidden !important; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
            [class*="terminalInstances"]::-webkit-scrollbar { display:none; }
            [class*="instanceOption"] { flex:0 0 auto !important; min-width:max-content !important; }
            [class*="welcome"] { min-width:0 !important; padding-left:8px !important; padding-right:8px !important; }
            [class*="welcomeHeader"] { min-width:0 !important; gap:8px !important; }
            [class*="welcomeLogo"] { width:auto !important; height:auto !important; max-width:110px !important; max-height:52px !important; }
            [class*="terminalHeader"] { min-width:0 !important; padding-left:8px !important; padding-right:8px !important; gap:8px !important; }
            [class*="terminalTag"] { overflow:hidden !important; text-overflow:ellipsis !important; white-space:nowrap !important; }
            [class*="inboxButton"] { flex:0 0 auto !important; }
            .xterm, .xterm-screen, .xterm-viewport { max-width:100% !important; }
            .xterm-viewport { overflow-x:hidden !important; overflow-y:auto !important; -webkit-overflow-scrolling:touch; }
            .winbox { max-width:calc(100vw - 12px) !important; max-height:calc(100dvh - 12px) !important; }
            .wb-body { max-width:100% !important; overflow:auto !important; -webkit-overflow-scrolling:touch; }
          }

          @media (max-width: 700px), (max-width: 1024px) and (orientation: portrait) {
            [class*="rightPanelWrapper"] { display:none !important; }
            [class*="terminalContainer"] { flex:1 1 100% !important; }
          }

          @media (max-width: 640px) {
            body, #root, .app-container { width:100vw !important; min-height:100dvh !important; }
            .app-container { padding-top:var(--dni-safe-top) !important; padding-bottom:var(--dni-safe-bottom) !important; }
            header nav a { padding:9px 9px !important; font-size:10px !important; letter-spacing:.02em !important; }
            [class*="welcome"] { padding-top:5px !important; padding-bottom:5px !important; }
            [class*="welcomeText"], [class*="welcomeUser"] { font-size:clamp(11px, 3vw, 14px) !important; }
            [class*="welcomeLogo"] { max-width:86px !important; max-height:40px !important; }
            [class*="terminalHeader"] { min-height:34px !important; }
            [class*="terminalTag"] { font-size:11px !important; }
            [class*="inboxButton"] { padding:6px 8px !important; font-size:10px !important; }
            [class*="terminalBodyContainer"] { overflow:hidden !important; }
            .winbox { width:calc(100vw - 8px) !important; height:calc(100dvh - 8px) !important; left:4px !important; top:4px !important; right:auto !important; bottom:auto !important; transform:none !important; }
          }

          @media (min-width: 701px) and (max-width: 1024px) and (orientation: landscape) {
            [class*="rightPanelWrapper"] { max-width:220px !important; min-width:180px !important; }
            [class*="rightPanel"] { font-size:.86em !important; }
            [class*="welcomeLogo"] { max-width:100px !important; }
          }
          </style>'''

          logo_script = r'''<script id="dni-logo-rebrand">
          (() => {
            const DNI_LOGO = '__DNI_LOGO__';
            const logoSource = /\/(?:scipnet|scp)(?:[-_.][^/]*)?\.(?:svg|png|webp)(?:\?.*)?$/i;
            const isOldBrandLogo = (img) => {
              const src = (img.getAttribute('src') || '').trim();
              const meta = [img.getAttribute('alt') || '', img.id || '', img.className || '', img.getAttribute('title') || ''].join(' ');
              return /(?:scipnet|scp).*logo|logo.*(?:scipnet|scp)|\bdni logo\b/i.test(meta) || logoSource.test(src);
            };
            const swap = (img) => {
              if (!img || img.tagName !== 'IMG' || img.dataset.dniLogo === '1') return;
              if (!isOldBrandLogo(img)) return;
              img.src = DNI_LOGO;
              img.alt = 'DNI Logo';
              img.dataset.dniLogo = '1';
              img.removeAttribute('srcset');
            };
            const scan = (root = document) => {
              if (root.tagName === 'IMG') swap(root);
              if (root.querySelectorAll) root.querySelectorAll('img').forEach(swap);
            };
            const start = () => {
              scan(document);
              new MutationObserver(records => {
                for (const record of records) {
                  if (record.type === 'attributes') swap(record.target);
                  for (const node of record.addedNodes || []) scan(node);
                }
              }).observe(document.documentElement, {subtree:true, childList:true, attributes:true, attributeFilter:['src','alt','class','title']});
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true});
            else start();
          })();
          </script>'''.replace('__DNI_LOGO__', dni_logo_web)

          head_add = (
              '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n'
              + f'<link rel="icon" type="image/png" href="{dni_logo_web}">\n'
              + f'<link rel="apple-touch-icon" href="{dni_logo_web}">\n'
              + mobile_style + '\n'
          )
          html = html.replace('</head>', head_add + '</head>', 1)
          if '</body>' in html.lower():
              html = re.sub(r'</body>', logo_script + '\n</body>', html, count=1, flags=re.I)
          else:
              html += logo_script

'''

          if 'dni-mobile-responsive' in s or 'dni-logo-rebrand' in s:
              raise SystemExit('DNI mobile/logo patch already present')
          s = s.replace(anchor, patch + anchor, 1)

          verify_anchor = "          grep -q 'dni-visible-branding' \"$SITE/index.html\"\n"
          if verify_anchor not in s:
              raise SystemExit('Could not find verification anchor')
          s = s.replace(
              verify_anchor,
              verify_anchor
              + "          test -s \"$SITE/assets/DNI-Logo.png\"\n"
              + "          grep -q 'dni-mobile-responsive' \"$SITE/index.html\"\n"
              + "          grep -q 'dni-logo-rebrand' \"$SITE/index.html\"\n",
              1,
          )

          # Strengthen the Android smoke test: no horizontal page overflow and the
          # visible brand logo must have been swapped to the DNI asset.
          state_anchor = "            text: (document.body?.innerText || '').slice(0,1600)\n"
          if state_anchor in s:
              s = s.replace(
                  state_anchor,
                  "            text: (document.body?.innerText || '').slice(0,1600),\n"
                  "            overflowX: Math.max(0, document.documentElement.scrollWidth - innerWidth),\n"
                  "            dniLogos: document.querySelectorAll('img[data-dni-logo=\"1\"]').length\n",
                  1,
              )
          exit_anchor = "          if (!upper.includes('ADMIN@DNI')) process.exit(7);\n"
          if exit_anchor in s:
              s = s.replace(
                  exit_anchor,
                  exit_anchor
                  + "          if (state.overflowX > 12) process.exit(8);\n"
                  + "          if (state.dniLogos < 1) process.exit(9);\n",
                  1,
              )

          p.write_text(s, 'utf-8')
          PY

          rm -f .github/workflows/apply-dni-mobile-branding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-pages.yml .github/workflows/apply-dni-mobile-branding.yml
          git commit -m 'Add DNI logo and responsive mobile tablet layout'
          git push

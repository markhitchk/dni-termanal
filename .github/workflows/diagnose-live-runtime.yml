name: Diagnose live SCiPNET runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current live Vite bundle
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://scipnet-terminal.web.app'
          curl -fsSL --retry 3 "$BASE/" -o /tmp/live-index.html
          python3 <<'PY'
          import re
          from pathlib import Path
          html=Path('/tmp/live-index.html').read_text('utf-8',errors='ignore')
          m=re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']',html,re.I)
          if not m: raise SystemExit('No entry JS found')
          Path('/tmp/js-path.txt').write_text(m.group(1))
          PY
          JS_PATH="$(cat /tmp/js-path.txt)"
          curl -fsSL --retry 3 "$BASE$JS_PATH" -o /tmp/live.js

          python3 <<'PY'
          import re
          from pathlib import Path
          raw=Path('/tmp/live.js').read_text('utf-8',errors='ignore')
          secret_pat=re.compile(r'(?<![A-Za-z0-9_-])sk\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+')
          text=secret_pat.sub('[REDACTED_MAPBOX_SECRET]',raw)
          out=['bundle_bytes='+str(len(raw.encode('utf-8')))]
          keys=['createRoot','__vitePreload','__vite__mapDeps','onAuthStateChanged','currentUser','Suspense','Terminal-H5d9AOym','EmailInterface','mapbox','[REDACTED_MAPBOX_SECRET]']
          for key in keys:
              out.append('\n## '+key)
              hits=[m.start() for m in re.finditer(re.escape(key),text,re.I)]
              out.append('hits='+str(len(hits)))
              for pos in hits[:4]:
                  s=max(0,pos-300); e=min(len(text),pos+700)
                  out.append(text[s:e].replace('`','\u02cb').replace('\n',' '))
          out.append('\n## bundle tail')
          out.append(text[-7000:].replace('`','\u02cb').replace('\n',' '))
          report='\n'.join(out)
          Path('/tmp/runtime-report.md').write_text(report[:55000],'utf-8')
          PY

      - name: Publish diagnostic issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "TEMP bootstrap diagnostic $GITHUB_RUN_ID" \
            --body-file /tmp/runtime-report.md

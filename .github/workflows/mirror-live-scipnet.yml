name: Mirror live SCiPNET deployment

on:
  push:
    paths:
      - '.github/workflows/mirror-live-scipnet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get legacy path inventory
        run: |
          git clone --depth 1 https://github.com/Milkyroad/SCiPNET.git /tmp/upstream

      - name: Mirror current Firebase deployment
        env:
          BASE_URL: https://scipnet-terminal.web.app
        run: |
          python3 <<'PY'
          import os, re, ssl, sys, time
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, unquote
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          base = os.environ['BASE_URL'].rstrip('/') + '/'
          host = urlsplit(base).netloc
          out = Path('/tmp/live-mirror')
          out.mkdir(parents=True, exist_ok=True)

          static_exts = {
              '.html','.htm','.js','.mjs','.cjs','.css','.json','.xml','.txt','.svg',
              '.png','.jpg','.jpeg','.gif','.webp','.ico','.bmp','.avif',
              '.mp3','.wav','.ogg','.m4a','.mp4','.webm',
              '.woff','.woff2','.ttf','.otf','.eot','.map','.webmanifest','.pdf'
          }

          queue = []
          queued = set()
          fetched = set()

          def normalize(url_or_path, parent='/'):
              u = urljoin(base + parent.lstrip('/'), url_or_path)
              s = urlsplit(u)
              if s.scheme not in ('http','https') or s.netloc != host:
                  return None
              path = unquote(s.path or '/')
              if not path.startswith('/'):
                  path = '/' + path
              return path

          def allowed(path):
              if path == '/' or path.endswith('/'):
                  return True
              suffix = Path(path).suffix.lower()
              return suffix in static_exts

          def add(value, parent='/'):
              p = normalize(value, parent)
              if p and allowed(p) and p not in queued and p not in fetched:
                  queued.add(p)
                  queue.append(p)

          # Live entry points.
          for p in ['/', '/robots.txt', '/sitemap.xml', '/favicon.ico', '/manifest.json', '/site.webmanifest']:
              add(p)

          # Every path shipped by the older public repo is also probed against the LIVE host.
          public = Path('/tmp/upstream/public')
          if public.exists():
              for fp in public.rglob('*'):
                  if fp.is_file():
                      add('/' + fp.relative_to(public).as_posix())

          attr_re = re.compile(r'''(?:src|href|poster|data-src|data-href)\s*=\s*["']([^"'#]+)["']''', re.I)
          css_re = re.compile(r'''url\(\s*["']?([^)'"\s]+)''', re.I)
          import_re = re.compile(r'''(?:import\s*(?:\(|)|from\s*)?|require\s*\()["']([^"']+)["']''')
          file_re = re.compile(r'''["']((?:/|\./|\.\./)[^"'<>\s\\]+?\.(?:html?|js|mjs|cjs|css|json|xml|txt|svg|png|jpe?g|gif|webp|ico|avif|mp3|wav|ogg|m4a|mp4|webm|woff2?|ttf|otf|eot|map|webmanifest|pdf)(?:\?[^"']*)?)["']''', re.I)
          loc_re = re.compile(r'<loc>\s*([^<]+?)\s*</loc>', re.I)

          def save_path(path):
              rel = path.lstrip('/')
              if not rel or path.endswith('/'):
                  rel = rel.rstrip('/')
                  rel = (rel + '/index.html') if rel else 'index.html'
              return out / rel

          def fetch(path):
              url = urljoin(base, path.lstrip('/'))
              req = Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; DNI-Terminal-Live-Mirror/1.0)',
                  'Accept': '*/*'
              })
              try:
                  with urlopen(req, timeout=25, context=ssl.create_default_context()) as r:
                      data = r.read()
                      status = getattr(r, 'status', 200)
                      ctype = (r.headers.get('Content-Type') or '').lower()
                      final = urlsplit(r.geturl())
                      if final.netloc != host:
                          return None, None
                      if status != 200:
                          return None, None
              except (HTTPError, URLError, TimeoutError, ValueError) as e:
                  return None, None

              dest = save_path(path)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              print(f'{len(data):>9}  {path}')
              return data, ctype

          # Crawl same-origin public files, including new chunk/asset references in current JS/CSS/HTML.
          max_files = 2500
          while queue and len(fetched) < max_files:
              path = queue.pop(0)
              queued.discard(path)
              if path in fetched:
                  continue
              fetched.add(path)
              data, ctype = fetch(path)
              if data is None:
                  continue

              is_text = ('text/' in ctype or 'javascript' in ctype or 'json' in ctype or
                         'xml' in ctype or 'svg' in ctype or Path(path).suffix.lower() in
                         {'.html','.htm','.js','.mjs','.cjs','.css','.json','.xml','.txt','.svg','.map','.webmanifest'})
              if not is_text:
                  continue
              try:
                  text = data.decode('utf-8', errors='ignore')
              except Exception:
                  continue

              refs = []
              refs += attr_re.findall(text)
              refs += css_re.findall(text)
              refs += import_re.findall(text)
              refs += file_re.findall(text)
              if path.endswith('sitemap.xml'):
                  refs += loc_re.findall(text)
              for ref in refs:
                  ref = ref.strip()
                  if not ref or ref.startswith(('data:','javascript:','mailto:','tel:','#')):
                      continue
                  add(ref, path)

          print(f'Fetched {sum(1 for p in out.rglob("*") if p.is_file())} live files.')
          if len(fetched) >= max_files:
              print('WARNING: crawler reached safety limit', file=sys.stderr)
          PY

      - name: Replace repository working tree with live deployment
        run: |
          # Keep only git metadata and this temporary workflow while copying the live site.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/live-mirror/. ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'Live deployment already matches repository.'
            exit 0
          fi
          git commit -m 'Mirror current scipnet-terminal.web.app deployment'
          git push origin HEAD:main

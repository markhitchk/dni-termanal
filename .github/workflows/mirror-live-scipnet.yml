name: Mirror live SCiPNET deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-live-scipnet
  cancel-in-progress: true

jobs:
  mirror:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get known public path inventory
        run: |
          git clone --depth 1 https://github.com/Milkyroad/SCiPNET.git /tmp/upstream

      - name: Mirror current Firebase deployment
        env:
          BASE_URL: https://scipnet-terminal.web.app
        run: |
          python3 <<'PY'
          import os, re, ssl
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, unquote
          from urllib.request import Request, urlopen

          base = os.environ['BASE_URL'].rstrip('/') + '/'
          host = urlsplit(base).netloc
          out = Path('/tmp/live-mirror')
          out.mkdir(parents=True, exist_ok=True)

          static_exts = {
              '.html','.htm','.js','.mjs','.cjs','.css','.json','.xml','.txt','.svg',
              '.png','.jpg','.jpeg','.gif','.webp','.ico','.bmp','.avif',
              '.mp3','.wav','.ogg','.m4a','.mp4','.webm',
              '.woff','.woff2','.ttf','.otf','.eot','.map','.webmanifest','.pdf'
          }
          text_exts = {'.html','.htm','.js','.mjs','.cjs','.css','.json','.xml','.txt','.svg','.map','.webmanifest'}

          attr_re = re.compile(r'''(?:src|href|poster|data-src|data-href)\s*=\s*["']([^"'#]+)["']''', re.I)
          css_re = re.compile(r'''url\(\s*["']?([^)'"\s]+)''', re.I)
          file_re = re.compile(r'''["']((?:https?://[^"']+|/|\./|\.\./)[^"'<>\s\\]*?\.(?:html?|js|mjs|cjs|css|json|xml|txt|svg|png|jpe?g|gif|webp|ico|bmp|avif|mp3|wav|ogg|m4a|mp4|webm|woff2?|ttf|otf|eot|map|webmanifest|pdf)(?:\?[^"']*)?)["']''', re.I)
          loc_re = re.compile(r'<loc>\s*([^<]+?)\s*</loc>', re.I)

          def normalize(value, parent='/'):
              u = urljoin(base + parent.lstrip('/'), value)
              s = urlsplit(u)
              if s.scheme not in ('http','https') or s.netloc != host:
                  return None
              path = unquote(s.path or '/')
              if not path.startswith('/'):
                  path = '/' + path
              if path == '/' or path.endswith('/') or Path(path).suffix.lower() in static_exts:
                  return path
              return None

          def save_path(path):
              rel = path.lstrip('/')
              if not rel or path.endswith('/'):
                  rel = rel.rstrip('/')
                  rel = (rel + '/index.html') if rel else 'index.html'
              return out / rel

          def fetch(path):
              url = urljoin(base, path.lstrip('/'))
              req = Request(url, headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
              try:
                  with urlopen(req, timeout=8, context=ssl.create_default_context()) as r:
                      if getattr(r, 'status', 200) != 200 or urlsplit(r.geturl()).netloc != host:
                          return path, None, None
                      data = r.read()
                      ctype = (r.headers.get('Content-Type') or '').lower()
              except Exception:
                  return path, None, None
              dest = save_path(path)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              return path, data, ctype

          seeds = {'/','/robots.txt','/sitemap.xml','/favicon.ico','/manifest.json','/site.webmanifest'}
          public = Path('/tmp/upstream/public')
          if public.exists():
              for fp in public.rglob('*'):
                  if fp.is_file():
                      seeds.add('/' + fp.relative_to(public).as_posix())

          seen = set()
          pending = set(seeds)
          max_files = 2500

          for round_no in range(8):
              batch = sorted(p for p in pending if p not in seen)
              pending.clear()
              if not batch or len(seen) >= max_files:
                  break
              if len(seen) + len(batch) > max_files:
                  batch = batch[:max_files-len(seen)]
              print(f'Round {round_no+1}: probing {len(batch)} paths')
              seen.update(batch)
              results = []
              with ThreadPoolExecutor(max_workers=32) as ex:
                  futs = [ex.submit(fetch, p) for p in batch]
                  for fut in as_completed(futs):
                      results.append(fut.result())

              for path, data, ctype in results:
                  if data is None:
                      continue
                  print(f'{len(data):>9}  {path}')
                  is_text = ('text/' in ctype or 'javascript' in ctype or 'json' in ctype or 'xml' in ctype or 'svg' in ctype or Path(path).suffix.lower() in text_exts)
                  if not is_text:
                      continue
                  text = data.decode('utf-8', errors='ignore')
                  refs = attr_re.findall(text) + css_re.findall(text) + file_re.findall(text)
                  if path.endswith('sitemap.xml'):
                      refs += loc_re.findall(text)
                  for ref in refs:
                      ref = ref.strip()
                      if not ref or ref.startswith(('data:','javascript:','mailto:','tel:','#')):
                          continue
                      p = normalize(ref, path)
                      if p and p not in seen:
                          pending.add(p)

          files = [p for p in out.rglob('*') if p.is_file()]
          print(f'Fetched {len(files)} files from the LIVE Firebase deployment.')
          if not (out / 'index.html').exists():
              raise SystemExit('Live root index was not fetched; refusing to replace repository.')
          PY

      - name: Replace repository tree with live files
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/live-mirror/. ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'Live deployment already matches repository.'
            exit 0
          fi
          git commit -m 'Replace outdated source with current live SCiPNET deployment'
          git push origin HEAD:main

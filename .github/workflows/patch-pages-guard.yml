name: Patch Pages guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-pages-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix false Vite dependency assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-pages.yml')
          t=p.read_text()
          old="grep -q '/dni-termanal/assets/Terminal-H5d9AOym.js' \"$SITE\"/assets/dni-entry-*.js"
          new="grep -q 'dni-termanal/assets/Terminal-H5d9AOym.js' \"$SITE\"/assets/dni-entry-*.js"
          if old not in t:
              raise SystemExit('expected guard not found')
          p.write_text(t.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-pages.yml
          git commit -m 'Fix false Pages dependency guard'
          git push origin HEAD:main

name: Exact live SCiPNET import

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact deployed files
        shell: bash
        run: |
          set -u
          BASE='https://scipnet-terminal.web.app'
          OUT='/tmp/live'
          rm -rf "$OUT"
          mkdir -p "$OUT/assets" "$OUT/favicon"
          : > "$OUT/MIRROR_STATUS.txt"

          get() {
            rel="$1"
            dest="$OUT/${rel#/}"
            mkdir -p "$(dirname "$dest")"
            code=$(curl -sS -L --retry 2 --connect-timeout 10 --max-time 180 -w '%{http_code}' -o "$dest" "$BASE$rel")
            rc=$?
            size=0
            [ -f "$dest" ] && size=$(wc -c < "$dest")
            echo "$rel http=$code rc=$rc bytes=$size" | tee -a "$OUT/MIRROR_STATUS.txt"
            return 0
          }

          get '/'
          mv "$OUT/index.html" "$OUT/index.html.tmp" 2>/dev/null || true
          # curl writes the root to /tmp/live/ when given rel '/', so fetch it explicitly too.
          code=$(curl -sS -L --retry 2 --connect-timeout 10 --max-time 180 -w '%{http_code}' -o "$OUT/index.html" "$BASE/")
          echo "/index.html http=$code rc=$? bytes=$(wc -c < "$OUT/index.html")" >> "$OUT/MIRROR_STATUS.txt"

          get '/assets/index-DFQE3juD.js'
          get '/assets/index-DF9dB6rR.css'
          get '/favicon/apple-touch-icon.png'
          get '/favicon/favicon-32x32.png'
          get '/favicon/favicon-16x16.png'
          get '/favicon/site.webmanifest'
          get '/favicon/safari-pinned-tab.svg'
          get '/favicon/android-chrome-192x192.png'
          get '/favicon/android-chrome-512x512.png'
          get '/robots.txt'
          get '/sitemap.xml'

          echo '--- fetched files ---' >> "$OUT/MIRROR_STATUS.txt"
          find "$OUT" -type f -printf '%P %s\n' | sort >> "$OUT/MIRROR_STATUS.txt"
          cat "$OUT/MIRROR_STATUS.txt"

          # Refuse a false-success mirror if the known live Vite bundles did not arrive.
          [ -s "$OUT/index.html" ] || exit 21
          [ -s "$OUT/assets/index-DFQE3juD.js" ] || exit 22
          [ -s "$OUT/assets/index-DF9dB6rR.css" ] || exit 23

      - name: Replace outdated repository copy
        shell: bash
        run: |
          set -e
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/live/. ./
          rm -f index.html.tmp

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace outdated copy with exact current SCiPNET deployment' || exit 0

          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; }
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1

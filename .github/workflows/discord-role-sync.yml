name: DNI Discord Role Sync

on:
  workflow_run:
    workflows: ["Deploy DNI VPS"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dni-discord-role-sync
  cancel-in-progress: true

jobs:
  sync-roles:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DNI_DISCORD_GUILD_ID }}
      DISCORD_DM_USER_ID: "1459731143472713922"
      STAR_COMMS_OWNER_KEY: ${{ secrets.STAR_COMMS_OWNER_KEY }}

    steps:
      - name: Checkout deployed main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate Discord role tooling
        run: |
          node --check scripts/pull-discord-role-ids.mjs
          node --check scripts/register-discord-role-export-command.mjs
          php -l public/discord/interactions.php
          php -l public/sync-discord-bot.php

      - name: Sync Discord bot runtime to DNI VPS
        id: runtime_sync
        if: env.DISCORD_BOT_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "configured=false" >> "$GITHUB_OUTPUT"

          if [ -z "${STAR_COMMS_OWNER_KEY:-}" ]; then
            echo "::warning::STAR_COMMS_OWNER_KEY is unavailable, so the Discord bot runtime could not be synchronized to the VPS."
            exit 0
          fi

          response_file="$(mktemp)"
          headers=(
            -H "Accept: application/json"
            -H "X-DNI-Star-Comms-Owner-Key: ${STAR_COMMS_OWNER_KEY}"
            -H "X-DNI-Discord-Bot-Token: ${DISCORD_BOT_TOKEN}"
          )

          if [ -n "${DISCORD_GUILD_ID:-}" ]; then
            headers+=( -H "X-DNI-Discord-Guild-Id: ${DISCORD_GUILD_ID}" )
          fi

          code="$(curl --show-error --silent \
            --connect-timeout 20 \
            --max-time 90 \
            -X POST \
            "${headers[@]}" \
            -o "$response_file" \
            -w '%{http_code}' \
            "https://www.dreadnoughtimperium.org/sync-discord-bot.php" || true)"

          if [[ ! "$code" =~ ^[0-9]{3}$ ]]; then code="000"; fi
          echo "Discord bot runtime sync -> HTTP ${code}"
          cat "$response_file" || true

          if [ "$code" = "200" ] && grep -Eq '"discordBotConfigured"[[:space:]]*:[[:space:]]*true' "$response_file"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Discord bot runtime sync did not complete. /exportroles registration will be skipped this run."
          fi

          rm -f "$response_file"

      - name: Pull DNI Discord role IDs and DM report
        if: env.DISCORD_BOT_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail

          set +e
          npm run discord:roles
          rc=$?
          set -e

          if [ "$rc" -eq 2 ]; then
            echo "::warning::Discord role sync completed, but one or more target roles were missing or duplicated. Check the DM report."
            exit 0
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::error::Discord role sync failed with exit code ${rc}."
            exit "$rc"
          fi

          echo "DNI Discord role IDs synchronized and DM report sent."

      - name: Register mobile /exportroles command
        if: steps.runtime_sync.outputs.configured == 'true'
        shell: bash
        env:
          DNI_DISCORD_INTERACTIONS_URL: https://www.dreadnoughtimperium.org/discord/interactions.php
        run: npm run discord:register-role-export

      - name: Discord token not configured notice
        if: env.DISCORD_BOT_TOKEN == ''
        run: |
          echo "::warning::DISCORD_BOT_TOKEN is not configured. DNI Discord role export was skipped."
          echo "Add a GitHub Actions repository secret named DISCORD_BOT_TOKEN to enable the mobile /exportroles command."

      - name: Publish role sync summary
        if: always()
        shell: bash
        run: |
          if [ -f data/dni-role-ids.json ]; then
            echo "## DNI Discord Role Sync" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            node -e '
              const fs = require("fs");
              const d = JSON.parse(fs.readFileSync("data/dni-role-ids.json", "utf8"));
              console.log(`- Server: ${d.guild?.name || "unknown"} (${d.guild?.id || "unknown"})`);
              console.log(`- Requested roles: ${d.requestedRoleCount ?? 0}`);
              console.log(`- Matched roles: ${d.matchedRoleCount ?? 0}`);
              console.log(`- Missing roles: ${(d.missing || []).length}`);
              console.log(`- Duplicate names: ${Object.keys(d.duplicates || {}).length}`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

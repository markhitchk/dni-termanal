name: Check deployed Pages assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages deployment
        run: sleep 75

      - name: Check current Pages runtime assets
        shell: bash
        run: |
          set -euo pipefail
          LIVE='https://scipnet-terminal.web.app'
          PAGES='https://markhitchk.github.io/dni-termanal'
          curl -fsSL "$LIVE/" -o /tmp/live-index.html
          python3 <<'PY'
          import re
          from pathlib import Path
          html=Path('/tmp/live-index.html').read_text('utf-8',errors='ignore')
          m=re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']',html,re.I)
          if not m: raise SystemExit('No entry JS')
          Path('/tmp/entry.txt').write_text(m.group(1).lstrip('/'))
          PY
          ENTRY="$(cat /tmp/entry.txt)"
          curl -fsSL "$LIVE/$ENTRY" -o /tmp/live.js
          python3 <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/live.js').read_text('utf-8',errors='ignore')
          assets=[]
          entry=Path('/tmp/entry.txt').read_text().strip()
          assets.append(entry)
          for a in re.findall(r'assets/[A-Za-z0-9_.-]+\.(?:js|css|png|jpg|jpeg|svg|webp|woff2?|ttf|json)',text):
              if a not in assets: assets.append(a)
          Path('/tmp/assets.txt').write_text('\n'.join(assets))
          PY

          : > /tmp/pages-assets.md
          echo '# GitHub Pages asset check' >> /tmp/pages-assets.md
          echo >> /tmp/pages-assets.md
          while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            code=$(curl -L -sS -o /tmp/a.bin -w '%{http_code}' "$PAGES/$rel" || true)
            size=$(wc -c < /tmp/a.bin 2>/dev/null || echo 0)
            printf '%s  %s bytes  `%s`\n' "$code" "$size" "$rel" >> /tmp/pages-assets.md
          done < /tmp/assets.txt

      - name: Publish asset report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "TEMP Pages asset check $GITHUB_RUN_ID" --body-file /tmp/pages-assets.md

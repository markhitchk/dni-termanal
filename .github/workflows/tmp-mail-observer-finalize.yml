name: Temporary mail observer finalize

on:
  push:
    branches:
      - fix/scoped-mail-admin-observers

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/scoped-mail-admin-observers
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Scope core mail observer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/src/js/mail.js')
          text = path.read_text()
          old = """function startMailObservers() {
            if (!mailMutationObserver && document.body) {
              mailMutationObserver = new MutationObserver(queueMailUiScan);
              mailMutationObserver.observe(document.body, { childList: true, subtree: true });
            }
          """
          new = """function startMailObservers() {
            if (!mailMutationObserver && shell instanceof HTMLElement) {
              mailMutationObserver = new MutationObserver(queueMailUiScan);
              mailMutationObserver.observe(shell, { childList: true, subtree: true });
            }
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one mail observer target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Assert observer scope before build
        run: |
          ! grep -Fq "mailMutationObserver.observe(document.body" public/src/js/mail.js
          grep -Fq "mailMutationObserver.observe(shell, { childList: true, subtree: true });" public/src/js/mail.js

      - run: npm run build

      - run: php scripts/build/build-lamp.php . "${GITHUB_SHA:0:12}"

      - run: npm run verify

      - name: Assert observer scope after verification
        run: |
          ! grep -Fq "mailMutationObserver.observe(document.body" public/src/js/mail.js
          grep -Fq "mailMutationObserver.observe(shell, { childList: true, subtree: true });" public/src/js/mail.js
          cmp public/src/js/mail.js public/dist/mail.js

      - name: Commit final source-only scope
        shell: bash
        run: |
          rm .github/workflows/tmp-mail-observer-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/src/js/mail.js .github/workflows/tmp-mail-observer-finalize.yml
          git commit -m "Scope core mail mutation observer"
          git push origin HEAD:fix/scoped-mail-admin-observers

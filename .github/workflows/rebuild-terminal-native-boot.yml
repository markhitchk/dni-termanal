name: Rebuild Native DNI Terminal Boot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-terminal-native-boot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Animate the real DNI Terminal boot sequence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          script_path = Path('public/src/js/script.js')
          script = script_path.read_text()

          state_anchor = "let autocompleteIndex = -1;\n"
          state_replacement = """let autocompleteIndex = -1;
let terminalBootSequence = 0;
let terminalBooting = false;
const terminalReducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches === true;
const terminalBootDelay = ms => new Promise(resolve => window.setTimeout(resolve, terminalReducedMotion ? 0 : ms));
"""
          if state_anchor not in script:
              raise SystemExit('Terminal boot state anchor missing.')
          script = script.replace(state_anchor, state_replacement, 1)

          old_boot = re.compile(r"function boot\(\) \{.*?\n\}\nfunction showHelp\(\) \{", re.S)
          new_boot = r'''async function typeBootLine(text, className = '', speed = 7, sequenceId = terminalBootSequence) {
  const line = row('', `${className} dni-terminal-boot-line`.trim());
  if (terminalReducedMotion) {
    line.textContent = text;
    return true;
  }
  for (let index = 0; index < text.length; index += 1) {
    if (sequenceId !== terminalBootSequence) return false;
    line.textContent += text[index];
    windowEl.scrollTop = windowEl.scrollHeight;
    await terminalBootDelay(index % 14 === 0 ? speed + 3 : speed);
  }
  await terminalBootDelay(42);
  return sequenceId === terminalBootSequence;
}

async function boot() {
  const sequenceId = ++terminalBootSequence;
  terminalBooting = true;
  const prompt = document.querySelector('.terminal-prompt');
  if (prompt) {
    prompt.hidden = true;
    prompt.classList.remove('dni-terminal-ready');
  }
  input.disabled = true;
  input.value = '';
  input.setAttribute('aria-busy', 'true');
  output.replaceChildren();

  const lines = [
    ['---------------------- DNI TERMINAL v4.3.0 ----------------------', 'separator', 3],
    ['DREADNOUGHT IMPERIUM', '', 8],
    ['DREADNOUGHT IMPERIUM DATABASE NETWORK', '', 7],
    ['DNI COMMAND NETWORK // ONLINE', 'dni-terminal-status-ok', 7],
    ['IMPERIAL DATABASE LINK // ESTABLISHED', 'dni-terminal-status-ok', 7],
    ['SECURE TERMINAL SESSION // ACTIVE', 'dni-terminal-status-ok', 7],
    [`Access Time: ${accessTime()}`, 'muted', 6],
    ['Welcome to the Dreadnought Imperium Database Network.', '', 6],
    ['Authorized personnel may access DNI records, operational services,', 'muted', 4],
    ['communications, sector data, and official network announcements.', 'muted', 4],
    ["Enter 'help' to display available terminal commands.", '', 5],
    ["Enter 'access <number>' to retrieve a DNI database record.", '', 5],
    ["Example: 'access 173' retrieves DNI-173.", '', 5],
    ["Enter 'mail' to access DNI Mail and official announcements.", '', 5],
    ['------------------- DREADNOUGHT IMPERIUM -------------------', 'separator', 3]
  ];

  for (const [text, className, speed] of lines) {
    const completed = await typeBootLine(text, className, speed, sequenceId);
    if (!completed) return;
  }

  if (sequenceId !== terminalBootSequence) return;
  terminalBooting = false;
  input.disabled = false;
  input.removeAttribute('aria-busy');
  if (prompt) {
    prompt.hidden = false;
    prompt.classList.add('dni-terminal-ready');
  }
  input.focus({ preventScroll: true });
  windowEl.scrollTop = windowEl.scrollHeight;
}
function showHelp() {'''
          script, count = old_boot.subn(new_boot, script, count=1)
          if count != 1:
              raise SystemExit(f'Expected one terminal boot function, replaced {count}.')

          script = script.replace("    case 'clear':\n      boot();\n      break;", "    case 'clear':\n      void boot();\n      break;", 1)
          script = script.replace("initializeMail();\nboot();\nrenderComms();", "initializeMail();\nvoid boot();\nrenderComms();", 1)

          script_path.write_text(script)

          effects_path = Path('public/src/js/system-effects.js')
          effects = effects_path.read_text()

          css_anchor = "    .dni-primary-action:active,.dni-admin-action:active,.small-action:active,.nav-tab:active{transform:translateY(1px) scale(.985)}\n"
          css_extra = """    .terminal-output .dni-terminal-boot-line{animation:dni-terminal-line-live .14s ease both}
    .terminal-output .dni-terminal-status-ok{color:#b7d9ad;text-shadow:0 0 5px rgba(87,197,58,.12)}
    .terminal-prompt.dni-terminal-ready{animation:dni-terminal-prompt-live .22s ease both}
    .terminal-prompt.dni-terminal-ready .command-input{caret-color:#c8a866;caret-shape:block}
"""
          if css_anchor not in effects:
              raise SystemExit('System effects CSS anchor missing.')
          effects = effects.replace(css_anchor, css_anchor + css_extra, 1)

          key_anchor = "    @keyframes dni-cursor-blink{0%,46%{opacity:1}47%,100%{opacity:0}}\n"
          key_extra = """    @keyframes dni-terminal-line-live{from{opacity:0;transform:translateY(2px);filter:brightness(.7)}to{opacity:1;transform:none;filter:none}}
    @keyframes dni-terminal-prompt-live{from{opacity:0}to{opacity:1}}
"""
          if key_anchor not in effects:
              raise SystemExit('System effects keyframe anchor missing.')
          effects = effects.replace(key_anchor, key_anchor + key_extra, 1)

          listener_old = """    if (!panelName || panelName === lastPanel) return;
    lastPanel = panelName;
    if (!initialBootComplete) return;
    void showBoot(panelName, { initial: false });
"""
          listener_new = """    if (!panelName || panelName === lastPanel) return;
    lastPanel = panelName;
    if (!initialBootComplete) return;
    if (panelName === 'terminal') {
      animateActivePanel(panelName);
      return;
    }
    void showBoot(panelName, { initial: false });
"""
          if listener_old not in effects:
              raise SystemExit('System effects panel listener anchor missing.')
          effects = effects.replace(listener_old, listener_new, 1)

          initial_old = """  const firstPanel = activePanelName();
  lastPanel = firstPanel;
  void showBoot(firstPanel, { initial: true });
"""
          initial_new = """  const firstPanel = activePanelName();
  lastPanel = firstPanel;
  if (firstPanel === 'terminal') {
    initialBootComplete = true;
  } else {
    void showBoot(firstPanel, { initial: true });
  }
"""
          if initial_old not in effects:
              raise SystemExit('System effects initial boot anchor missing.')
          effects = effects.replace(initial_old, initial_new, 1)
          effects_path.write_text(effects)
          PY

          node --check public/src/js/script.js
          node --check public/src/js/system-effects.js

      - name: Commit native Terminal boot and remove one-time workflow
        shell: bash
        run: |
          git config user.name "markhitchk"
          git config user.email "mark.hitchk@gmail.com"
          git rm .github/workflows/rebuild-terminal-native-boot.yml
          git add public/src/js/script.js public/src/js/system-effects.js
          git commit -m "Animate native DNI Terminal boot sequence"
          git pull --rebase origin main
          git push origin HEAD:main

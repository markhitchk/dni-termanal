name: DNI Mail Incremental Refresh Patch

on:
  push:
    branches:
      - fix/mail-realtime-incremental-refresh-work

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply focused patch
        run: |
          python3 .github/apply-mail-realtime-incremental-fix.py
          python3 .github/fix-mail-realtime-test-marker.py
          python3 .github/remove-overbroad-mail-realtime-test.py

      - name: Confirm thread module loading references
        run: grep -R -n "mail-threads.js" public scripts tests .github || true

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        shell: bash
        run: |
          npm run build
          php scripts/build/build-lamp.php . "${GITHUB_SHA:0:12}"
          npm run verify
          php -l server/php/dni-mail-realtime.php
          node --input-type=module --check < public/src/js/mail/mail-realtime.js
          node --input-type=module --check < public/src/js/mail/mail.js
          node --input-type=module --check < public/src/js/mail/mail-threads.js
          if grep -n "inbox.dispatchEvent(new MouseEvent('click'" public/src/js/mail/mail-realtime.js; then
            echo 'Synthetic inbox refresh still present' >&2
            exit 1
          fi

      - name: Commit focused fix
        shell: bash
        run: |
          rm .github/workflows/mail-realtime-incremental-fix.yml .github/apply-mail-realtime-incremental-fix.py .github/fix-mail-realtime-test-marker.py .github/remove-overbroad-mail-realtime-test.py
          git config user.name "markhitchk"
          git config user.email "mark.hitchk@gmail.com"
          git add public/src/js/mail/mail-realtime.js public/src/js/mail/mail.js public/src/js/mail/mail-threads.js server/php/dni-mail-realtime.php tests/mail/verify-mail-realtime.js .github/workflows/mail-realtime-incremental-fix.yml .github/apply-mail-realtime-incremental-fix.py .github/fix-mail-realtime-test-marker.py .github/remove-overbroad-mail-realtime-test.py
          git commit -m "Make DNI Mail realtime refresh incremental"
          git push origin HEAD

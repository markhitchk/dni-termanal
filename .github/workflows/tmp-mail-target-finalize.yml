name: Temporary canonical mail observer finalize

on:
  push:
    branches:
      - fix/scoped-mail-admin-observers

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/scoped-mail-admin-observers
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Scope canonical core mail observer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/src/js/mail/mail.js')
          text = path.read_text()
          old = """function startMailObservers() {
            if (!mailMutationObserver && document.body) {
              mailMutationObserver = new MutationObserver(queueMailUiScan);
              mailMutationObserver.observe(document.body, { childList: true, subtree: true });
            }
          """
          new = """function startMailObservers() {
            if (!mailMutationObserver && shell instanceof HTMLElement) {
              mailMutationObserver = new MutationObserver(queueMailUiScan);
              mailMutationObserver.observe(shell, { childList: true, subtree: true });
            }
          """
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one core mail observer target, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Audit observer scope before build
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "mailMutationObserver.observe(shell, { childList: true, subtree: true });" public/src/js/mail/mail.js
          grep -Fq "observer.observe(adminRoot, { childList: true, subtree: true });" public/src/js/admin-mail-address-editor.js
          grep -Fq "observer.observe(adminRoot, { childList: true, subtree: true });" public/src/js/admin-role-prefill.js
          if grep -R -n -E '\.observe\(document\.(body|documentElement)' public/src/js/mail public/src/js/mail*.js public/src/js/admin*.js; then
            echo "::error::Unscoped mail/admin MutationObserver target remains."
            exit 1
          fi

      - run: npm run build

      - run: php scripts/build/build-lamp.php . "${GITHUB_SHA:0:12}"

      - run: npm run verify

      - name: Audit observer scope after verification
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "mailMutationObserver.observe(shell, { childList: true, subtree: true });" public/src/js/mail/mail.js
          if grep -R -n -E '\.observe\(document\.(body|documentElement)' public/src/js/mail public/src/js/mail*.js public/src/js/admin*.js; then
            echo "::error::Unscoped mail/admin MutationObserver target remains after verification."
            exit 1
          fi
          cmp public/src/js/mail/mail.js public/dist/mail.js

      - name: Commit canonical source-only fix
        shell: bash
        run: |
          rm .github/workflows/tmp-mail-target-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/src/js/mail/mail.js .github/workflows/tmp-mail-target-finalize.yml
          git commit -m "Scope canonical core mail mutation observer"
          git push origin HEAD:fix/scoped-mail-admin-observers

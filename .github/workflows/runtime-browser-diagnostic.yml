name: Runtime browser diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-browser-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          cd "$RUNNER_TEMP/diag"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Run Android and desktop diagnostics
        shell: bash
        run: |
          cd "$RUNNER_TEMP/diag"
          cat > diagnose.mjs <<'EOF'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs';
          const target = 'https://markhitchk.github.io/dni-termanal/';
          const browser = await chromium.launch({ headless: true });

          async function runCase(name, opts) {
            const context = await browser.newContext(opts);
            const page = await context.newPage();
            const out = [];
            const add = s => { out.push(s); console.log(`[${name}] ${s}`); };
            page.on('console', m => add(`console:${m.type()} ${m.text()}`));
            page.on('pageerror', e => add(`PAGEERROR ${e.stack || e.message}`));
            page.on('requestfailed', r => add(`REQUESTFAILED ${r.method()} ${r.url()} :: ${r.failure()?.errorText || 'unknown'}`));
            page.on('response', r => { if (r.status() >= 400) add(`HTTP ${r.status()} ${r.url()}`); });
            await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60000 }).catch(e => add(`GOTOERROR ${e.message}`));
            let prev = 0;
            for (const ms of [500,1000,2000,5000,10000]) {
              await page.waitForTimeout(ms-prev); prev=ms;
              const s = await page.evaluate(() => {
                const root=document.getElementById('root');
                return {
                  href:location.href,
                  title:document.title,
                  rootHTML:root?.innerHTML.length ?? -1,
                  rootChildren:root?.children.length ?? -1,
                  rootText:(root?.innerText||'').slice(0,1000),
                  bodyText:(document.body?.innerText||'').slice(0,1000)
                };
              });
              add(`STATE ${ms}ms ${JSON.stringify(s)}`);
            }
            await page.screenshot({path:`${name}.png`,fullPage:true}).catch(()=>{});
            fs.writeFileSync(`${name}.txt`, out.join('\n'));
            await context.close();
          }

          await runCase('android', {...devices['Pixel 7']});
          await runCase('desktop', {viewport:{width:1280,height:800}});
          await browser.close();
          EOF
          node diagnose.mjs | tee runtime.log

      - name: Report results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP/diag"
          {
            echo '# Runtime browser diagnostic'
            echo
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo
            echo '```text'
            if [ -f runtime.log ]; then tail -c 60000 runtime.log; else echo 'No runtime log'; fi
            echo
            echo '```'
          } > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "TEMP DNI runtime diagnostic $GITHUB_RUN_ID" --body-file issue.md

# rerun after duplicate-React fix

name: Runtime browser diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-browser-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          cd "$RUNNER_TEMP/diag"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Run desktop and Android browser diagnostics
        shell: bash
        run: |
          cd "$RUNNER_TEMP/diag"
          cat > diagnose.mjs <<'EOF'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs';

          const target = 'https://markhitchk.github.io/dni-termanal/';
          const browser = await chromium.launch({ headless: true });

          async function runCase(name, contextOptions) {
            const context = await browser.newContext(contextOptions);
            const page = await context.newPage();
            const events = [];
            const add = s => { events.push(s); console.log(`[${name}] ${s}`); };

            page.on('console', msg => add(`console:${msg.type()} ${msg.text()}`));
            page.on('pageerror', err => add(`PAGEERROR ${err.stack || err.message}`));
            page.on('requestfailed', req => add(`REQUESTFAILED ${req.method()} ${req.url()} :: ${req.failure()?.errorText || 'unknown'}`));
            page.on('response', res => { if (res.status() >= 400) add(`HTTP ${res.status()} ${res.url()}`); });

            add(`navigating ${target}`);
            try { await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60000 }); }
            catch (e) { add(`GOTOERROR ${e.stack || e.message}`); }

            let previous = 0;
            for (const wait of [1000, 3000, 8000, 15000]) {
              await page.waitForTimeout(wait - previous);
              previous = wait;
              const state = await page.evaluate(() => {
                const root = document.getElementById('root');
                const body = document.body;
                const rootRect = root?.getBoundingClientRect();
                return {
                  href: location.href,
                  title: document.title,
                  readyState: document.readyState,
                  bodyText: (body?.innerText || '').slice(0, 1800),
                  rootText: (root?.innerText || '').slice(0, 1800),
                  rootHtmlLength: root?.innerHTML?.length ?? -1,
                  rootChildren: root?.children?.length ?? -1,
                  rootDisplay: root ? getComputedStyle(root).display : 'missing',
                  rootVisibility: root ? getComputedStyle(root).visibility : 'missing',
                  rootOpacity: root ? getComputedStyle(root).opacity : 'missing',
                  rootRect: rootRect ? {x:rootRect.x,y:rootRect.y,width:rootRect.width,height:rootRect.height} : null,
                  bodyBg: body ? getComputedStyle(body).backgroundColor : 'missing'
                };
              });
              add(`STATE ${wait}ms ${JSON.stringify(state)}`);
            }

            await page.screenshot({ path: `${name}.png`, fullPage: true }).catch(e => add(`SCREENSHOTERROR ${e.message}`));
            fs.writeFileSync(`${name}.events.txt`, events.join('\n'));
            fs.writeFileSync(`${name}.html`, await page.content());
            await context.close();
          }

          await runCase('desktop', { viewport: { width: 1280, height: 800 } });
          await runCase('android', { ...devices['Pixel 7'] });
          await browser.close();
          EOF
          node diagnose.mjs | tee runtime-diagnostic.log

      - name: Inspect deployed Vite asset resolver
        shell: bash
        run: |
          cd "$RUNNER_TEMP/diag"
          curl -fsSL --retry 3 'https://markhitchk.github.io/dni-termanal/assets/index-DFQE3juD.js' -o bundle.js
          python3 <<'PY' >> runtime-diagnostic.log
          from pathlib import Path
          import re
          text = Path('bundle.js').read_text('utf-8', errors='ignore')
          print('\n=== VITE ASSET RESOLVER INSPECTION ===')
          print('bundle bytes', len(text))
          for needle in ['Unable to preload CSS', '__vite__mapDeps', 'new URL(', 'document.baseURI']:
              print(f'\n--- needle: {needle!r} ---')
              starts = [m.start() for m in re.finditer(re.escape(needle), text)]
              print('hits', len(starts))
              for pos in starts[:4]:
                  print(text[max(0,pos-900):min(len(text),pos+1400)])
          print('\n--- likely root-prefix expressions near preload helper ---')
          target = text.find('Unable to preload CSS')
          region = text[max(0,target-12000):target+4000] if target >= 0 else text[:50000]
          for pat in [r'=[^;]{0,120}"/"[^;]{0,160}', r'=>[^;]{0,120}"/"[^;]{0,160}', r'new URL\([^;]{0,300}']:
              print('pattern', pat)
              for m in list(re.finditer(pat, region))[:10]:
                  print(m.group(0))
          PY

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-browser-diagnostic
          path: |
            ${{ runner.temp }}/diag/runtime-diagnostic.log
            ${{ runner.temp }}/diag/desktop.events.txt
            ${{ runner.temp }}/diag/android.events.txt
            ${{ runner.temp }}/diag/desktop.html
            ${{ runner.temp }}/diag/android.html
            ${{ runner.temp }}/diag/desktop.png
            ${{ runner.temp }}/diag/android.png
            ${{ runner.temp }}/diag/bundle.js
          if-no-files-found: error

      - name: Report results in temporary issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP/diag"
          {
            echo '# Runtime browser diagnostic'
            echo
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo
            echo '```text'
            if [ -f runtime-diagnostic.log ]; then
              tail -c 60000 runtime-diagnostic.log
            else
              echo 'runtime-diagnostic.log was not created; an earlier step failed.'
            fi
            echo
            echo '```'
          } > issue-body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "TEMP runtime browser diagnostic $GITHUB_RUN_ID" --body-file issue-body.md

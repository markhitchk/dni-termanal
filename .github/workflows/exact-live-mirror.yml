name: Import exact current SCiPNET deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  mirror:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror verified live files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          PHASE='start'
          REPORT=/tmp/exact-mirror-report.txt
          : > "$REPORT"
          finish() {
            rc=$?
            {
              echo "Run: $GITHUB_RUN_ID"
              echo "Commit: $GITHUB_SHA"
              echo "Exit: $rc"
              echo "Phase: $PHASE"
              echo '--- report ---'
              cat "$REPORT" 2>/dev/null || true
              echo '--- git status ---'
              git status --short 2>/dev/null || true
            } > /tmp/final-report.txt
            gh issue create --repo "$GITHUB_REPOSITORY" --title "TEMP exact mirror result $GITHUB_RUN_ID" --body-file /tmp/final-report.txt >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap finish EXIT

          BASE='https://scipnet-terminal.web.app'
          OUT='/tmp/live'
          PHASE='prepare output'
          rm -rf "$OUT"
          mkdir -p "$OUT/assets" "$OUT/favicon"

          PHASE='fetch root'
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 180 "$BASE/" -o "$OUT/index.html"
          echo "root $(wc -c < "$OUT/index.html")" >> "$REPORT"

          PHASE='fetch js'
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 180 "$BASE/assets/index-DFQE3juD.js" -o "$OUT/assets/index-DFQE3juD.js"
          echo "js $(wc -c < "$OUT/assets/index-DFQE3juD.js")" >> "$REPORT"

          PHASE='fetch css'
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 180 "$BASE/assets/index-DF9dB6rR.css" -o "$OUT/assets/index-DF9dB6rR.css"
          echo "css $(wc -c < "$OUT/assets/index-DF9dB6rR.css")" >> "$REPORT"

          PHASE='fetch ancillary files'
          for rel in \
            /favicon/apple-touch-icon.png \
            /favicon/favicon-32x32.png \
            /favicon/favicon-16x16.png \
            /favicon/site.webmanifest \
            /favicon/safari-pinned-tab.svg \
            /favicon/android-chrome-192x192.png \
            /favicon/android-chrome-512x512.png \
            /favicon/favicon.ico \
            /robots.txt \
            /sitemap.xml; do
            mkdir -p "$OUT/$(dirname "${rel#/}")"
            if curl -fsSL --retry 2 --connect-timeout 10 --max-time 60 "$BASE$rel" -o "$OUT/${rel#/}"; then
              echo "$rel $(wc -c < "$OUT/${rel#/}")" >> "$REPORT"
            else
              rm -f "$OUT/${rel#/}"
              echo "$rel unavailable" >> "$REPORT"
            fi
          done

          PHASE='verify sizes'
          test "$(wc -c < "$OUT/assets/index-DFQE3juD.js")" = '2577603'
          test "$(wc -c < "$OUT/assets/index-DF9dB6rR.css")" = '40416'

          PHASE='write build info'
          cat > "$OUT/LIVE_BUILD_INFO.txt" <<EOF
          Mirrored from: https://scipnet-terminal.web.app/
          Root SHA-256: $(sha256sum "$OUT/index.html" | awk '{print $1}')
          JS: /assets/index-DFQE3juD.js
          JS bytes: $(wc -c < "$OUT/assets/index-DFQE3juD.js")
          JS SHA-256: $(sha256sum "$OUT/assets/index-DFQE3juD.js" | awk '{print $1}')
          CSS: /assets/index-DF9dB6rR.css
          CSS bytes: $(wc -c < "$OUT/assets/index-DF9dB6rR.css")
          CSS SHA-256: $(sha256sum "$OUT/assets/index-DF9dB6rR.css" | awk '{print $1}')
          EOF

          PHASE='sync main'
          git pull --ff-only origin main

          PHASE='replace tree'
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a "$OUT"/. ./

          PHASE='stage'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          PHASE='commit'
          git commit -m 'Replace outdated copy with exact current SCiPNET deployment'

          PHASE='push'
          git push origin HEAD:main
          PHASE='done'

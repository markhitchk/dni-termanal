name: Import exact current SCiPNET deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  mirror:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch live deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE='https://scipnet-terminal.web.app'
          OUT='/tmp/live'
          rm -rf "$OUT"
          mkdir -p "$OUT/assets" "$OUT/favicon"

          curl -fsSL --retry 3 --connect-timeout 10 --max-time 180 "$BASE/" -o "$OUT/index.html"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 180 "$BASE/assets/index-DFQE3juD.js" -o "$OUT/assets/index-DFQE3juD.js"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 180 "$BASE/assets/index-DF9dB6rR.css" -o "$OUT/assets/index-DF9dB6rR.css"

          # Capture the public icons/manifests referenced by the live HTML.
          for rel in \
            /favicon/apple-touch-icon.png \
            /favicon/favicon-32x32.png \
            /favicon/favicon-16x16.png \
            /favicon/site.webmanifest \
            /favicon/safari-pinned-tab.svg \
            /favicon/android-chrome-192x192.png \
            /favicon/android-chrome-512x512.png \
            /favicon/favicon.ico \
            /robots.txt \
            /sitemap.xml; do
            mkdir -p "$OUT/$(dirname "${rel#/}")"
            curl -fsSL --retry 2 --connect-timeout 10 --max-time 60 "$BASE$rel" -o "$OUT/${rel#/}" || rm -f "$OUT/${rel#/}"
          done

          # Discover and fetch additional same-origin static assets named inside the current JS/CSS/HTML.
          python3 <<'PY'
          import re, subprocess
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit

          base = 'https://scipnet-terminal.web.app/'
          root = Path('/tmp/live')
          host = urlsplit(base).netloc
          allowed = {'.js','.mjs','.css','.json','.xml','.txt','.svg','.png','.jpg','.jpeg','.gif','.webp','.ico','.bmp','.avif','.mp3','.wav','.ogg','.m4a','.mp4','.webm','.woff','.woff2','.ttf','.otf','.eot','.map','.webmanifest','.pdf'}
          text_ext = {'.html','.js','.mjs','.css','.json','.xml','.txt','.svg','.map','.webmanifest'}
          patterns = [
              re.compile(r'''["']((?:/)?(?:assets|favicon|images|img|audio|fonts|locales|static)/[^"'<>\\\s?#]+(?:\?[^"']*)?)["']''', re.I),
              re.compile(r'''url\(\s*["']?([^\)"'\s]+)''', re.I),
              re.compile(r'''new\s+URL\(\s*["']([^"']+)["']\s*,\s*import\.meta\.url''', re.I),
          ]
          seen = set()

          def normalize(ref, parent='/'):
              if ref.startswith(('data:','blob:','javascript:','#')):
                  return None
              u = urljoin(base + parent.lstrip('/'), ref)
              s = urlsplit(u)
              if s.netloc != host:
                  return None
              p = s.path
              if not p.startswith('/'):
                  p = '/' + p
              if Path(p).suffix.lower() not in allowed:
                  return None
              return p

          for _ in range(6):
              refs = set()
              for f in list(root.rglob('*')):
                  if not f.is_file() or f.suffix.lower() not in text_ext:
                      continue
                  text = f.read_text('utf-8', errors='ignore')
                  parent = '/' + f.relative_to(root).as_posix()
                  for pat in patterns:
                      for ref in pat.findall(text):
                          p = normalize(ref, parent)
                          if p:
                              refs.add(p)
              added = 0
              for p in sorted(refs):
                  if p in seen:
                      continue
                  seen.add(p)
                  dest = root / p.lstrip('/')
                  if dest.exists():
                      continue
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  r = subprocess.run(['curl','-fsSL','--retry','2','--connect-timeout','10','--max-time','90',base.rstrip('/')+p,'-o',str(dest)])
                  if r.returncode == 0 and dest.exists() and dest.stat().st_size:
                      print(f'fetched {p} {dest.stat().st_size} bytes')
                      added += 1
                  else:
                      dest.unlink(missing_ok=True)
              if added == 0:
                  break
          PY

          cat > "$OUT/LIVE_BUILD_INFO.txt" <<EOF
          Mirrored from: $BASE/
          Live entry JS: /assets/index-DFQE3juD.js
          Live entry CSS: /assets/index-DF9dB6rR.css
          JS SHA-256: $(sha256sum "$OUT/assets/index-DFQE3juD.js" | awk '{print $1}')
          CSS SHA-256: $(sha256sum "$OUT/assets/index-DF9dB6rR.css" | awk '{print $1}')
          Root SHA-256: $(sha256sum "$OUT/index.html" | awk '{print $1}')
          EOF

          echo 'Captured files:'
          find "$OUT" -type f -printf '%P %s bytes\n' | sort

      - name: Replace outdated repository contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/live/. ./

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace outdated copy with exact current SCiPNET deployment'

          git pull --rebase origin main
          git push origin HEAD:main

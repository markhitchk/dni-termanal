name: Deploy DNI Terminal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build current terminal site
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://scipnet-terminal.web.app'
          SITE="$RUNNER_TEMP/site"
          PAGE_BASE='/dni-termanal'
          rm -rf "$SITE"
          mkdir -p "$SITE/assets" "$SITE/favicon"

          curl -fsSL --retry 3 "$BASE/" -o "$SITE/index.html"

          python3 <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'site'
          html=(root/'index.html').read_text('utf-8')
          js=re.search(r'<script[^>]+src=["\']([^"\']+\.js)["\']',html,re.I)
          css=re.search(r'<link[^>]+href=["\']([^"\']+\.css)["\']',html,re.I)
          if not js or not css:
              raise SystemExit('Could not find Vite entry files')
          Path(os.environ['RUNNER_TEMP'],'entry-js.txt').write_text(js.group(1))
          Path(os.environ['RUNNER_TEMP'],'entry-css.txt').write_text(css.group(1))
          PY

          ENTRY_JS="$(cat "$RUNNER_TEMP/entry-js.txt")"
          ENTRY_CSS="$(cat "$RUNNER_TEMP/entry-css.txt")"
          mkdir -p "$SITE/$(dirname "${ENTRY_JS#/}")" "$SITE/$(dirname "${ENTRY_CSS#/}")"
          curl -fsSL --retry 3 "$BASE$ENTRY_JS" -o "$SITE/${ENTRY_JS#/}"
          curl -fsSL --retry 3 "$BASE$ENTRY_CSS" -o "$SITE/${ENTRY_CSS#/}"

          for rel in \
            /favicon/apple-touch-icon.png \
            /favicon/favicon-32x32.png \
            /favicon/favicon-16x16.png \
            /favicon/site.webmanifest \
            /favicon/android-chrome-192x192.png \
            /favicon/android-chrome-512x512.png \
            /favicon/favicon.ico; do
            mkdir -p "$SITE/$(dirname "${rel#/}")"
            curl -fsSL --retry 2 "$BASE$rel" -o "$SITE/${rel#/}" || rm -f "$SITE/${rel#/}"
          done

          export PAGE_BASE
          python3 <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'site'
          base=os.environ['PAGE_BASE']
          secret=re.compile(r'(?<![A-Za-z0-9_-])sk\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+')
          for f in [root/'index.html', *root.glob('assets/*.js'), *root.glob('assets/*.css')]:
              if not f.exists(): continue
              text=f.read_text('utf-8',errors='ignore')
              text=secret.sub('pk.REDACTED_FOR_GITHUB_PAGES.INVALID',text)
              for p in ('assets/','favicon/','images/','img/','audio/','fonts/','static/'):
                  text=text.replace('"/'+p,'"'+base+'/'+p)
                  text=text.replace("'/"+p,"'"+base+'/'+p)
                  text=text.replace('url(/'+p,'url('+base+'/'+p)
              f.write_text(text,'utf-8')
          index=root/'index.html'
          html=index.read_text('utf-8')
          html=html.replace('<base target="_blank" />',f'<base href="{base}/" target="_blank" />')
          index.write_text(html,'utf-8')
          (root/'404.html').write_text(html,'utf-8')
          PY

          touch "$SITE/.nojekyll"
          echo "Built Pages artifact:"
          find "$SITE" -maxdepth 2 -type f -printf '%P %s bytes\n' | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "TEMP Pages build failure $GITHUB_RUN_ID" --body "The DNI Terminal GitHub Pages build failed. Run ID: $GITHUB_RUN_ID"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deploy failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "TEMP Pages deploy failure $GITHUB_RUN_ID" --body "The DNI Terminal GitHub Pages deploy failed. Run ID: $GITHUB_RUN_ID"

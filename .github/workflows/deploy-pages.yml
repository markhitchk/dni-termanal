# Optional GitHub Pages preview only. Production deploys to the OVH VPS.
name: Deploy DNI Pages Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dni-pages-preview
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Rebuild production files
        run: npm run build
      - name: Generate Star Comms public API config
        env:
          STAR_COMMS_OWNER_KEY: ${{ secrets.STAR_COMMS_OWNER_KEY }}
        run: node scripts/star-comms-pages-config.mjs
      - name: Verify DNI source and production bundle
        run: npm run verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: verify-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy DNI Pages preview
        id: deployment
        uses: actions/deploy-pages@v4

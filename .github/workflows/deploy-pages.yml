name: Deploy DNI Terminal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror current live Vite site
        shell: bash
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/site"
          export PAGE_BASE='/dni-termanal'
          rm -rf "$SITE"
          mkdir -p "$SITE"
          curl -fsSL --retry 3 'https://scipnet-terminal.web.app/' -o "$SITE/index.html"

          python3 <<'PY'
          import os, re, subprocess
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit

          base = 'https://scipnet-terminal.web.app/'
          host = urlsplit(base).netloc
          root = Path(os.environ['SITE'])
          page = os.environ['PAGE_BASE']
          build_id = os.environ.get('GITHUB_SHA', 'pages')

          text_ext = {'.html','.js','.mjs','.css','.json','.xml','.txt','.svg','.map','.webmanifest'}
          allowed = {'.js','.mjs','.css','.json','.xml','.txt','.svg','.png','.jpg','.jpeg','.gif','.webp','.ico','.bmp','.avif','.mp3','.wav','.ogg','.m4a','.mp4','.webm','.woff','.woff2','.ttf','.otf','.eot','.map','.webmanifest','.pdf'}
          root_dirs = ('assets/','favicon/','images/','img/','audio/','fonts/','static/')
          ext_group = r'(?:js|mjs|css|json|xml|txt|svg|png|jpg|jpeg|gif|webp|ico|bmp|avif|mp3|wav|ogg|m4a|mp4|webm|woff|woff2|ttf|otf|eot|map|webmanifest|pdf)'
          patterns = [
              re.compile(r'''(?:src|href|poster)\s*=\s*["']([^"'#]+)["']''', re.I),
              re.compile(r'''url\(\s*["']?([^\)"'\s]+)''', re.I),
              re.compile(r'''["']((?:/)?(?:assets|favicon|images|img|audio|fonts|static)/[^"'<>\\\s?#]+)["']''', re.I),
              re.compile(r'''["']((?:\./|\.\./)[^"'<>\\\s?#]+\.'''+ext_group+r''')["']''', re.I),
          ]

          def normalize(ref, parent='/'):
              ref = ref.strip()
              if not ref or ref.startswith(('data:','blob:','javascript:','mailto:','tel:','#')):
                  return None
              if ref.startswith('/'):
                  url = urljoin(base, ref)
              elif ref.startswith(root_dirs):
                  url = urljoin(base, ref)
              else:
                  url = urljoin(urljoin(base, parent.lstrip('/')), ref)
              split = urlsplit(url)
              if split.netloc != host:
                  return None
              path = split.path
              if Path(path).suffix.lower() not in allowed:
                  return None
              return path

          # Recursively mirror entry files, lazy chunks, CSS, fonts, images and audio.
          for round_no in range(20):
              refs = set()
              for file in list(root.rglob('*')):
                  if not file.is_file() or file.suffix.lower() not in text_ext:
                      continue
                  text = file.read_text('utf-8', errors='ignore')
                  parent = '/' + file.relative_to(root).as_posix()
                  for pattern in patterns:
                      for ref in pattern.findall(text):
                          path = normalize(ref, parent)
                          if path:
                              refs.add(path)

              downloaded = 0
              for path in sorted(refs):
                  dest = root / path.lstrip('/')
                  if dest.exists():
                      continue
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  rc = subprocess.run([
                      'curl','-fsSL','--retry','2','--connect-timeout','10','--max-time','120',
                      base.rstrip('/') + path,'-o',str(dest)
                  ]).returncode
                  if rc == 0 and dest.exists() and dest.stat().st_size:
                      downloaded += 1
                  else:
                      dest.unlink(missing_ok=True)
              print(f'round {round_no + 1}: {downloaded} new files')
              if downloaded == 0:
                  break

          for path in [
              '/favicon/apple-touch-icon.png','/favicon/favicon-32x32.png','/favicon/favicon-16x16.png',
              '/favicon/site.webmanifest','/favicon/android-chrome-192x192.png',
              '/favicon/android-chrome-512x512.png','/favicon/favicon.ico','/robots.txt','/sitemap.xml'
          ]:
              dest = root / path.lstrip('/')
              if dest.exists():
                  continue
              dest.parent.mkdir(parents=True, exist_ok=True)
              rc = subprocess.run(['curl','-fsSL','--retry','2',base.rstrip('/') + path,'-o',str(dest)]).returncode
              if rc != 0 or not dest.exists() or not dest.stat().st_size:
                  dest.unlink(missing_ok=True)

          # Rewrite deployment-root URLs for a GitHub project Pages subdirectory.
          # Also patch Vite's dependency map: builds made with base='/' store entries
          # as "assets/..." and the runtime prepends '/', which otherwise requests
          # https://markhitchk.github.io/assets/... instead of /dni-termanal/assets/....
          secret = re.compile(r'(?<![A-Za-z0-9_-])sk\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+')
          prefixes = ('assets/','favicon/','images/','img/','audio/','fonts/','static/')
          vite_map_patches = 0
          vite_map_entries = 0

          for file in root.rglob('*'):
              if not file.is_file() or file.suffix.lower() not in text_ext:
                  continue
              text = file.read_text('utf-8', errors='ignore')
              text = secret.sub('pk.REDACTED_FOR_GITHUB_PAGES.INVALID', text)

              for prefix in prefixes:
                  text = text.replace('"/' + prefix, '"' + page + '/' + prefix)
                  text = text.replace("'/" + prefix, "'" + page + '/' + prefix)
                  text = text.replace('url(/' + prefix, 'url(' + page + '/' + prefix)
                  text = text.replace('url("/' + prefix, 'url("' + page + '/' + prefix)
                  text = text.replace("url('/" + prefix, "url('" + page + '/' + prefix)

              if file.suffix.lower() in {'.js', '.mjs'}:
                  marker = 'const __vite__mapDeps='
                  pos = text.find(marker)
                  if pos >= 0:
                      end = text.find(';', pos)
                      if end > pos:
                          region = text[pos:end + 1]
                          patched = region
                          target_prefix = page.lstrip('/') + '/assets/'
                          before_dq = patched.count('"assets/')
                          before_sq = patched.count("'assets/")
                          patched = patched.replace('"assets/', '"' + target_prefix)
                          patched = patched.replace("'assets/", "'" + target_prefix)
                          changed = before_dq + before_sq
                          if changed:
                              text = text[:pos] + patched + text[end + 1:]
                              vite_map_patches += 1
                              vite_map_entries += changed
                              print(f'patched Vite dependency map in {file.relative_to(root)}: {changed} entries')

              file.write_text(text, 'utf-8')

          if vite_map_entries == 0:
              raise RuntimeError('Vite dependency map was not found/patched; refusing to deploy a known-broken project-Page build')
          print(f'Vite project-base patch: {vite_map_entries} dependency entries across {vite_map_patches} bundle(s)')

          index = root / 'index.html'
          html = index.read_text('utf-8')
          if '<base ' not in html.lower():
              html = html.replace('<head>', '<head>\n<base href="/dni-termanal/">', 1)
          else:
              html = re.sub(r'<base\b[^>]*>', '<base href="/dni-termanal/">', html, count=1, flags=re.I)

          # The live Vite bundle is patched for the Pages base path but retains its
          # upstream hashed filename. Add a deployment-specific query string so a
          # phone/browser cannot keep reusing the pre-patch bundle from cache.
          entry_asset = re.compile(r'''(/dni-termanal/assets/[^"'<>?]+\.(?:js|css))(?=["'])''')
          html, cache_bust_count = entry_asset.subn(lambda m: m.group(1) + '?v=' + build_id, html)
          if cache_bust_count == 0:
              raise RuntimeError('No entry JS/CSS URLs were cache-busted in index.html')
          print(f'Cache-busted {cache_bust_count} entry asset URL(s) with deployment {build_id}')

          index.write_text(html, 'utf-8')
          (root / '404.html').write_text(html, 'utf-8')
          PY

          touch "$SITE/.nojekyll"
          printf '%s\n' "$GITHUB_SHA" > "$SITE/DEPLOY_MARKER.txt"
          printf 'run=%s\nsha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$SITE/BUILD_INFO.txt"

          test -s "$SITE/index.html"
          test -s "$SITE/assets/index-DFQE3juD.js"
          test -s "$SITE/assets/index-DF9dB6rR.css"
          test -s "$SITE/assets/Terminal-H5d9AOym.js"
          test -s "$SITE/assets/index-BIDI7A8S.js"
          test -s "$SITE/assets/dynamic-import-helper-BheWnx7M.js"
          test -s "$SITE/assets/Terminal-DhLuIu0s.css"
          grep -q 'dni-termanal/assets/Terminal-H5d9AOym.js' "$SITE/assets/index-DFQE3juD.js"
          grep -q '?v=' "$SITE/index.html"
          echo "Pages artifact contains $(find "$SITE" -type f | wc -l) files"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

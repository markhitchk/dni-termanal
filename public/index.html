<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <meta name="description" content="DNI Terminal for Dreadnought Imperium communications, services, sectors, and local archive access.">
  <meta name="keywords" content="DNI,Dreadnought Imperium,DNI Terminal,DNI sectors,communications,services,terminal">
  <title>DNI Terminal | Dreadnought Imperium DNI Sectors</title>
  <link rel="icon" href="src/images/dni.svg" type="image/svg+xml">
  <link rel="stylesheet" href="dist/style.css">
</head>
<body data-panel="dashboard">
  <main class="app-shell">
    <header class="topbar">
      <img class="brand-logo" src="src/images/dni.svg" alt="DNI logo" width="48" height="48">
      <div class="brand-copy">
        <h1 class="brand-title">DNI TERMINAL v4.1.6</h1>
        <div class="brand-subtitle">DREADNOUGHT IMPERIUM NETWORK</div>
      </div>
    </header>

    <div class="nav-scroll" data-testid="nav-scroll">
      <nav class="nav-tabs" aria-label="DNI terminal sections" role="tablist">
        <button class="nav-tab" type="button" role="tab" aria-selected="false" tabindex="-1" data-panel="communications">DNI Communications</button>
        <button class="nav-tab" type="button" role="tab" aria-selected="false" tabindex="-1" data-panel="services">DNI Services</button>
        <button class="nav-tab" type="button" role="tab" aria-selected="true" tabindex="0" data-panel="dashboard">DNI Dashboard</button>
      </nav>
    </div>

    <section class="workspace">
      <section class="terminal-card" aria-label="DNI command terminal">
        <div class="terminal-header">DNI direct access terminal</div>
        <div id="terminal-output" class="terminal-output" role="log" aria-live="polite"></div>
        <label class="command-row" for="command-input">
          <span class="command-prompt">root@dni:~$</span>
          <input id="command-input" class="command-input" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Try 'ACCESS 173' to access DNI-173 or enter command...">
        </label>
      </section>

      <aside class="status-card" aria-label="DNI network status">
        <h2>DNI Network Status</h2>
        <ul class="status-list">
          <li><span>Network</span><strong>Online</strong></li>
          <li><span>Archive</span><strong>Local</strong></li>
          <li><span>Encryption</span><strong>AES-256</strong></li>
          <li><span>Sector</span><strong>DNI-01</strong></li>
          <li><span>Link</span><strong>Stable</strong></li>
        </ul>
      </aside>
    </section>

    <footer class="footer">Dreadnought Imperium • DNI Terminal • Data stays within the local terminal archive</footer>
  </main>
  <script type="module" src="dist/app.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" role="img" aria-labelledby="title desc">
  <title id="title">Roberts Space Industries RSI</title>
  <desc id="desc">Local RSI wordmark used by the DNI Citizen dashboard.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7f8"/>
      <stop offset="0.45" stop-color="#a9b1b8"/>
      <stop offset="1" stop-color="#e7ebee"/>
    </linearGradient>
  </defs>
  <rect width="420" height="180" fill="none"/>
  <g transform="skewX(-10)">
    <text x="48" y="108" font-family="Arial Black,Arial,sans-serif" font-size="92" font-weight="900" letter-spacing="-8" fill="url(#metal)" stroke="#6d747b" stroke-width="2">RSI</text>
  </g>
  <g fill="#f28c18" transform="translate(250 43) skewX(-10)">
    <rect x="0" y="0" width="9" height="72"/>
    <rect x="15" y="0" width="9" height="72"/>
    <rect x="30" y="0" width="9" height="72"/>
  </g>
  <text x="62" y="145" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#d6dce0">ROBERTS SPACE INDUSTRIES</text>
</svg>

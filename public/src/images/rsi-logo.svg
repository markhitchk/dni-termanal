<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" role="img" aria-labelledby="title desc">
  <title id="title">Roberts Space Industries RSI</title>
  <desc id="desc">White RSI wordmark used by the DNI Citizen dashboard.</desc>
  <rect width="420" height="180" fill="none"/>
  <g transform="skewX(-10)">
    <text x="48" y="108" font-family="Arial Black,Arial,sans-serif" font-size="92" font-weight="900" letter-spacing="-8" fill="#ffffff">RSI</text>
  </g>
  <g fill="#ffffff" transform="translate(250 43) skewX(-10)">
    <rect x="0" y="0" width="9" height="72"/>
    <rect x="15" y="0" width="9" height="72"/>
    <rect x="30" y="0" width="9" height="72"/>
  </g>
  <text x="62" y="145" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#ffffff">ROBERTS SPACE INDUSTRIES</text>
</svg>

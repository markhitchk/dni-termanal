<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <base href="../../">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="DNI Terminal for Dreadnought Imperium sectors, records, communications, services, and local archive access.">
  <title>DNI Terminal | Dreadnought Imperium DNI Sectors</title>
  <link rel="icon" href="src/images/dni-helmet-icon.webp" type="image/webp">
  <link rel="apple-touch-icon" href="src/images/dni-helmet.webp">
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <div class="nav-scroll" data-testid="nav-scroll">
    <nav class="nav-tabs" aria-label="DNI sections" role="tablist">
      <button class="nav-tab" type="button" role="tab" aria-selected="false" tabindex="-1" data-panel="communications">DNI Communications</button>
      <button class="nav-tab" type="button" role="tab" aria-selected="false" tabindex="-1" data-panel="services">DNI Services</button>
      <button class="nav-tab" type="button" role="tab" aria-selected="true" tabindex="0" data-panel="dashboard">DNI Dashboard</button>
    </nav>
  </div>

  <main class="terminal-shell" data-panel="dashboard">
    <section class="hero" aria-label="Researcher terminal header">
      <div class="welcome-line">
        <h1 class="welcome-title">WELCOME</h1>
        <span class="brand-logo-wrap"><img class="brand-logo" src="src/images/dni-helmet.webp" alt="DNI gold helmet emblem"></span>
      </div>
      <div class="researcher-title">RESEARCHER</div>

      <div class="terminal-picker">
        <div class="terminal-number" id="terminal-number">TERMINAL 1</div>
        <button class="terminal-add" id="terminal-add" type="button" aria-label="Add terminal">+</button>
      </div>

      <div class="hero-actions">
        <button class="hero-action primary" id="terminal-home" type="button">DNI TERMINAL</button>
        <button class="hero-action inbox" id="terminal-inbox" type="button"><span class="mail-icon" aria-hidden="true"></span>INBOX</button>
      </div>
    </section>

    <section class="terminal-frame" aria-label="DNI terminal">
      <div class="terminal-window" id="terminal-window">
        <div id="terminal-output" class="terminal-output" role="log" aria-live="polite"></div>
        <label class="terminal-prompt" for="command-input">
          <span class="prompt-admin">admin</span><span>@</span><span class="prompt-host">dni</span><span class="prompt-path">:~</span><span class="prompt-symbol">$</span>
          <input id="command-input" class="command-input" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command">
        </label>
      </div>
    </section>

    <div class="panel-note communications">DNI COMMUNICATIONS // ENCRYPTED MESSAGE ROUTING READY // INBOX STATUS AVAILABLE.</div>
    <div class="panel-note services">DNI SERVICES // NETWORK, ARCHIVE, AND SECTOR SERVICES READY.</div>
  </main>

  <script type="module" src="src/js/script.js"></script>
</body>
</html>

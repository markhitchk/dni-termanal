<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../../">
  <title>DNI Direct Access Terminal</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <main class="app-shell" style="display:block;min-height:100dvh;padding:24px">
    <section class="terminal-card" style="max-width:760px;margin:0 auto">
      <div class="terminal-header">DNI direct access terminal</div>
      <div class="terminal-output">
        <div class="line-accent">DNI DIRECT ACCESS TERMINAL</div>
        <div class="line-accent">DREADNOUGHT IMPERIUM</div>
        <div class="line-muted">DREADNOUGHT IMPERIUM NETWORK</div>
        <br>
        <img src="src/images/dni.svg" width="100" height="100" alt="DNI logo">
        <br><br>
        <div>Welcome to DNI Direct Access Terminal</div>
        <div class="line-accent">Type "Help" for more information</div>
      </div>
    </section>
  </main>
</body>
</html>
